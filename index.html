<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafolio de fotografía</title>
<meta name="description" content="Portafolio de fotografía.">
<meta name="theme-color" content="#333332">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23333332'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23efeee9' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wdth,wght@75..100,200..800&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* ───────── Sistema de diseño ─────────
   Base: gris medio neutro, para que el color de las fotos se vea fiel.
   Tipografía: Bricolage Grotesque (títulos condensados y ligeros; resto en ancho normal)
   y Newsreader cursiva solo para datos secundarios (contadores).
   Estructura: contenedor de 1360 px, escala de espacio de 8 px, filetes finos para separar secciones. */
:root{
  --gris-12:#2a2a29;
  --gris-18:#333332;
  --gris-25:#454543;
  --marfil:#efeee9;
  --humo:#a8a7a1;
  --tinta:#1d1d1c;
  --error:#a3261c;
  --linea:rgba(239,238,233,.16);
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --pad:clamp(16px,4vw,40px);
  --max:1360px;
  --seccion:clamp(48px,7vw,96px);
  --cabecera:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--gris-18);color:var(--marfil);font-family:var(--display);font-size:1rem;line-height:1.5}
body.lb-open{overflow:hidden}
body.has-admin{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{flex:1}
main:focus{outline:none}
img{max-width:100%}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--marfil);outline-offset:3px}
dialog :focus-visible,.admin-bar :focus-visible{outline-color:var(--tinta)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--marfil);color:var(--tinta);padding:.6em 1em}
.skip:focus{left:8px}
.page{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* Cabecera fija con menú */
.top{position:sticky;top:0;z-index:30;background:var(--gris-18);box-shadow:0 1px 0 var(--linea);transition:background-color .35s,box-shadow .35s}
.top-in{max-width:var(--max);margin:0 auto;padding:0 var(--pad);height:var(--cabecera);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-weight:600;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.nav{display:flex;align-items:center;gap:28px}
.nav a{padding:8px 0;border-bottom:1.5px solid transparent;color:var(--humo);font-size:.95rem;text-decoration:none}
.nav a:hover{color:var(--marfil)}
.nav a[aria-current]{color:var(--marfil);border-bottom-color:var(--marfil)}
.menu-btn{display:none;min-height:44px;padding:0 4px;border:0;background:none;color:inherit;font-weight:500;cursor:pointer}
@media (max-width:820px){
  .menu-btn{display:inline-flex;align-items:center}
  .nav{position:absolute;left:0;right:0;top:100%;display:none;flex-direction:column;align-items:stretch;gap:0;padding:4px var(--pad) 12px;background:var(--gris-18);border-bottom:1px solid var(--linea)}
  .nav.is-open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid var(--linea);font-size:1.05rem}
  .nav a:last-child{border-bottom:0}
  .nav a[aria-current]{border-bottom-color:var(--linea);font-weight:600}
}

/* Cabecera de página (migas + título) */
.page-head{padding:24px 0}
.crumbs{color:var(--humo);font-size:.9rem}
.crumbs a{text-underline-offset:3px}
.crumbs a:hover{color:var(--marfil)}
.crumbs .sep{margin:0 .5em}
.crumbs [aria-current]{color:var(--marfil)}
.title{margin:.3em 0 .1em;font-size:clamp(2.5rem,7vw,5rem);font-weight:300;font-stretch:75%;line-height:1;letter-spacing:-.02em;overflow-wrap:break-word}
.count{margin:-8px 0 24px;font-family:var(--serif);font-style:italic;color:var(--humo)}

/* Inicio */
.intro{padding:clamp(40px,8vw,96px) 0 clamp(32px,5vw,64px)}
.lead{margin:0;max-width:26em;font-size:clamp(2rem,5.2vw,4rem);font-weight:300;font-stretch:75%;line-height:1.05;letter-spacing:-.02em}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 24px;padding-bottom:12px;border-bottom:1px solid var(--linea)}
.sec-head h2{margin:0;font-size:1.25rem;font-weight:600}

/* Cuadrícula uniforme (categorías y carpetas) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 16px}
.card{display:block;text-decoration:none}
.card .ph{position:relative;aspect-ratio:4/5;background:var(--gris-12);overflow:hidden}
.card .ph::after{content:"";position:absolute;inset:0;background:rgba(20,20,19,0);transition:background .5s}
.card img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .7s cubic-bezier(.2,.7,.2,1)}
.card img.ok{opacity:1}
.card img.broken{display:none}
.card .nm{display:inline-block;margin-top:12px;padding-bottom:3px;font-size:1.0625rem;font-weight:500;line-height:1.3;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .4s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.card:hover img.ok{transform:scale(1.06)}.card:hover .ph::after{background:rgba(20,20,19,.22)}.card:hover .nm,.card:focus-visible .nm{background-size:100% 1px}}
@media (min-width:700px){.cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:40px 24px}}

/* Galería de fotos */
.sec-head.subhead{margin-top:var(--seccion)}
.wall{column-width:150px;column-gap:12px}
.tile{position:relative;break-inside:avoid;margin:0 0 12px}
.open{display:block;width:100%;padding:0;border:0;background:var(--gris-12);cursor:zoom-in;aspect-ratio:3/4;overflow:hidden}
.open img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s,transform .7s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.open:hover img.ok{transform:scale(1.04)}}
.open img.ok{opacity:1}
.open img.broken{display:none}
.del{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:50%;background:var(--marfil);color:var(--tinta);font-size:22px;line-height:1;cursor:pointer}
.del:hover{background:#fff}
@media (min-width:700px){.wall{column-width:260px;column-gap:16px}.tile{margin-bottom:16px}}

.pager{display:flex;justify-content:space-between;gap:16px;margin-top:var(--seccion);padding-top:20px;border-top:1px solid var(--linea)}
.pager a{display:block;font-weight:500;text-decoration:none}
.pager a:hover{text-decoration:underline;text-underline-offset:4px}
.pager .lbl{display:block;color:var(--humo);font-size:.85rem;font-weight:400}
.pager .next{margin-left:auto;text-align:right}

/* Foto circular del fotógrafo */
.avatar{--av:136px;width:var(--av);height:var(--av);flex:none;margin:7px;border-radius:50%;overflow:hidden;background:var(--gris-12);box-shadow:0 0 0 6px var(--gris-18),0 0 0 7px rgba(239,238,233,.4)}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.avatar img.ok{opacity:1}
.avatar.lg{--av:184px}
@media (min-width:700px){.avatar{--av:176px}.avatar.lg{--av:300px}}

/* Sobre mí en el inicio */
.home-about{margin-top:var(--seccion)}
.bio{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-top:8px}
.bio-tx{min-width:0}
@media (min-width:700px){.bio{flex-direction:row;align-items:center;gap:48px}}

/* Texto del fotógrafo (inicio y página Sobre mí) */
.bio-tx p,.about-tx p{max-width:60ch;margin:0 0 1em;font-size:1.0625rem;line-height:1.65}
.bio-tx .who,.about-tx .who{margin:0 0 .35em;font-size:1.375rem;font-weight:600;line-height:1.2}
.more{display:inline-block;padding:8px 0;font-weight:500;text-underline-offset:4px}
.more:hover{color:var(--humo)}

/* Página Sobre mí */
.about{display:grid;gap:24px;align-items:start;padding-top:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;max-width:60ch;margin:32px 0 0;padding-top:20px;border-top:1px solid var(--linea)}
.facts dt{color:var(--humo)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts a{text-underline-offset:3px}
@media (min-width:800px){
  .about{grid-template-columns:auto minmax(0,1fr);gap:72px}
  .about.solo{grid-template-columns:minmax(0,1fr);max-width:48rem}
}

/* Estados vacíos y de carga */
.empty{max-width:46rem;padding:clamp(40px,10vh,96px) 0}
.empty h2{margin:0 0 .3em;font-size:clamp(2rem,6vw,3.5rem);font-weight:300;font-stretch:75%;line-height:1;letter-spacing:-.02em}
.empty p{margin:0 0 1.2em;color:var(--humo);max-width:36rem}
.sk{background:linear-gradient(90deg,var(--gris-12),var(--gris-25),var(--gris-12));background-size:200% 100%;animation:sh 1.6s linear infinite}
.sk-lead{height:clamp(56px,10vw,120px);max-width:60%;margin:clamp(40px,8vw,96px) 0 clamp(32px,5vw,64px)}
.sk-title{height:clamp(48px,8vw,80px);max-width:40%;margin:56px 0 32px}
.sk-card{aspect-ratio:4/5}
@keyframes sh{to{background-position:-200% 0}}

/* Pie */
.foot{margin-top:var(--seccion);border-top:1px solid var(--linea);color:var(--humo);font-size:.925rem}
.foot-in{max-width:var(--max);margin:0 auto;padding:40px var(--pad) 24px}
.foot-grid{display:grid;gap:32px;grid-template-columns:1fr}
.foot h2{margin:0 0 12px;font-size:.9rem;font-weight:600;color:var(--marfil)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.foot li a,.foot li .plain{display:inline-block;padding:4px 0;text-decoration:none}
.foot li a:hover,.foot-base a:hover{color:var(--marfil);text-decoration:underline;text-underline-offset:3px}
.foot .wm{margin:0 0 8px;color:var(--marfil);font-weight:600;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase}
.foot .tag{margin:0;max-width:28rem}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:32px;padding-top:16px;border-top:1px solid var(--linea);font-size:.85rem}
.linklike{background:none;border:0;color:inherit;cursor:pointer;padding:.7em 0;text-decoration:underline;text-underline-offset:3px}
.linklike:hover{color:var(--marfil)}
@media (min-width:700px){.foot-grid{grid-template-columns:2fr 1fr 1fr}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55em 1.1em;border:1.5px solid currentColor;border-radius:2px;background:transparent;color:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--tinta);border-color:var(--tinta);color:var(--marfil)}
.btn{transition:background-color .25s,color .25s,border-color .25s}
.btn.light{background:var(--marfil);border-color:var(--marfil);color:var(--tinta)}
.btn.light:hover{background:#fff;border-color:#fff}
.btn.ghost{border-color:rgba(239,238,233,.7);background:rgba(20,20,19,.25);color:var(--marfil)}
.btn.ghost:hover{background:var(--marfil);border-color:var(--marfil);color:var(--tinta)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ico{min-width:44px;padding:0 12px;gap:8px}
.btn.ico svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ico .lbl{display:none}
@media (min-width:641px){.btn.ico .lbl{display:inline}}

/* Barra de administrador */
.admin-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:var(--marfil);color:var(--tinta)}
.admin-bar[hidden]{display:none}
.admin-bar .who{font-size:.9rem;color:#57564f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.admin-bar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.admin-bar .linklike{color:var(--tinta)}
@media (max-width:640px){.admin-bar .who{display:none}.admin-bar{justify-content:flex-end}}

/* Ventanas de diálogo */
dialog{width:min(92vw,460px);max-height:90vh;overflow:auto;padding:24px;border:0;border-radius:2px;background:var(--marfil);color:var(--tinta)}
dialog::backdrop{background:rgba(20,20,19,.72)}
dialog h2{margin:0 0 .4em;font-size:1.5rem;font-weight:600;line-height:1.2}
dialog p{margin:0 0 1em}
dialog .hint{color:#57564f;font-size:.95rem}
dialog label{display:block;font-weight:600;margin-bottom:.35em}
dialog input[type=text]{width:100%;min-height:46px;padding:.5em .7em;border:1.5px solid var(--tinta);border-radius:2px;background:#fff;color:var(--tinta);font:inherit}
dialog .err{min-height:1.4em;margin:.5em 0 0;color:var(--error);font-size:.95rem}
dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.gbtn{min-height:44px;display:flex;justify-content:center;margin:12px 0}
.drop{display:flex;align-items:center;justify-content:center;min-height:120px;padding:16px;border:2px dashed #8b8a83;border-radius:2px;text-align:center;font-weight:500;cursor:pointer}
.drop.over{background:#fff;border-color:var(--tinta)}
.uplist{list-style:none;margin:14px 0 0;padding:0;max-height:32vh;overflow:auto}
.uplist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #d3d2cb;font-size:.92rem}
.uplist .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.uplist .st{flex:none;color:#57564f}
.uplist .ok .st{color:#1f6b3a}
.uplist .bad .st{color:var(--error)}
.upsum{margin:12px 0 0;color:#57564f;font-size:.95rem;min-height:1.4em}

/* Visor de fotos */
.lb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(22,22,21,.98)}
.lb[hidden]{display:none}
.lb-stage{position:relative;flex:1;min-height:0;margin:0;display:flex;align-items:center;justify-content:center;padding:56px 0 4px}
.lb:not([hidden]){animation:fade .3s ease}
.lb-stage img{max-width:100%;max-height:calc(100vh - 118px);max-height:calc(100dvh - 118px);object-fit:contain;opacity:0;transform:scale(.985);transition:opacity .35s,transform .5s cubic-bezier(.2,.7,.2,1)}
.lb-stage img.ok{opacity:1;transform:none}
.lb.loading .lb-stage::after{content:"";position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:2px solid rgba(239,238,233,.25);border-top-color:var(--marfil);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lb-btn{position:absolute;z-index:2;width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(239,238,233,.12);color:var(--marfil);cursor:pointer}
.lb-btn:hover{background:rgba(239,238,233,.25)}
.lb-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-close{top:calc(8px + env(safe-area-inset-top));right:8px}
.lb-prev{left:8px;top:50%;margin-top:-24px}
.lb-next{right:8px;top:50%;margin-top:-24px}
.lb-bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px var(--pad) calc(12px + env(safe-area-inset-bottom));color:var(--humo);font-size:.95rem}
.lb-count{font-family:var(--serif);font-style:italic}

/* Avisos */
#toast{position:fixed;inset:auto auto 24px 50%;z-index:80;margin:0;width:max-content;height:auto;overflow:visible;transform:translateX(-50%);max-width:min(92vw,440px);padding:.7em 1.1em;border:0;border-radius:2px;background:var(--marfil);color:var(--tinta);font:inherit;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.error{background:var(--error);color:#fff}
body.has-admin #toast{bottom:calc(88px + env(safe-area-inset-bottom))}

/* Portada del inicio: fotos de tus categorías con zoom lento y desvanecido */
.hero{position:relative;margin-top:calc(var(--cabecera) * -1);height:clamp(480px,88vh,880px);height:clamp(480px,88svh,880px);overflow:hidden;background:var(--gris-12);color:var(--marfil)}
.hero-media{position:absolute;left:0;right:0;top:-80px;bottom:0;transform:translate3d(0,calc(var(--p,0) * 80px),0);will-change:transform}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.3s ease}
.slide.on{opacity:1}
.slide img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.slide.kb img{animation:kb 9s cubic-bezier(.25,.6,.3,1) forwards}
@keyframes kb{from{transform:scale(1.13) translate3d(var(--kx,1.5%),1%,0)}to{transform:scale(1) translate3d(0,0,0)}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(20,20,19,.6) 0,rgba(20,20,19,0) 24%),linear-gradient(to top,rgba(20,20,19,.82) 0,rgba(20,20,19,.25) 45%,rgba(20,20,19,0) 70%)}
.hero-in{position:relative;z-index:2;height:100%;max-width:var(--max);margin:0 auto;padding:0 var(--pad) clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(20px,3vw,32px);opacity:calc(1 - var(--p,0) * 1.15);transform:translate3d(0,calc(var(--p,0) * -28px),0)}
.hero h1{margin:0;max-width:12em;font-size:clamp(2.6rem,8.6vw,7.5rem);font-weight:300;font-stretch:75%;line-height:.95;letter-spacing:-.025em;text-shadow:0 2px 30px rgba(20,20,19,.35);animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 24px;animation:rise .9s .35s cubic-bezier(.2,.7,.2,1) both}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.hero-cap{font-family:var(--serif);font-style:italic;font-size:1.1rem;text-decoration:none;text-underline-offset:4px}
.hero-cap:hover{text-decoration:underline}
.dots{display:flex;align-items:center}
.dot{position:relative;width:40px;height:44px;padding:0;border:0;background:none;cursor:pointer}
.dot::before,.dot::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px}
.dot::before{background:rgba(239,238,233,.35)}
.dot::after{right:auto;width:0;background:var(--marfil)}
.dot[aria-current="true"]::after{width:calc(100% - 8px);transition:width 6.5s linear}
[id=work]{scroll-margin-top:var(--cabecera)}
.after-hero{padding-top:var(--seccion)}

/* La cabecera es transparente sobre la portada y se vuelve sólida al bajar */
body.hero-on .top:not(.solid):not(.menu-open){background:transparent;box-shadow:0 1px 0 transparent}
body.hero-on .top:not(.solid):not(.menu-open) .nav a{color:rgba(239,238,233,.88)}
body.hero-on .top:not(.solid):not(.menu-open) .nav a:hover,body.hero-on .top:not(.solid):not(.menu-open) .nav a[aria-current]{color:#fff}
body.hero-on .top:not(.solid):not(.menu-open) .nav a[aria-current]{border-bottom-color:#fff}

/* Efectos de entrada */
main.enter{animation:rise .5s cubic-bezier(.2,.7,.2,1)}
.rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .lb.loading .lb-stage::after{border-top-color:rgba(239,238,233,.25)}
  .hero-media,.hero-in{transform:none!important}
  .dot[aria-current="true"]::after{width:calc(100% - 8px)}
}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="top">
  <div class="top-in">

<!-- Tus datos personales viven en config.js -->
<script src="config.js"></script>
<script>
'use strict';

const CONFIG = Object.assign({
  API_URL: '', GOOGLE_CLIENT_ID: '',
  SITE_NAME: 'Portafolio', TAGLINE: '',
  ABOUT: '', ABOUT_PHOTO: '', ABOUT_PHOTO_POSITION: 'center 25%',
  CONTACT_EMAIL: '', INSTAGRAM: '', WHATSAPP: '', LOCATION: '',
  MAX_SIDE: 2400,       // lado mayor (px) al que se reducen las fotos antes de subirlas
  JPEG_QUALITY: 0.86,
}, window.PORTFOLIO_CONFIG || {});

const $ = (s, r) => (r || document).querySelector(s);
const main = $('#main');
const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];
const state = { tree: [], profile: null, admin: null, view: { type: 'home' }, token: 0, routeKey: null, revealed: new Set() };
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

class ApiError extends Error {
  constructor(code, message) { super(message); this.code = code; }
}

/* ───────── Utilidades de DOM ───────── */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}

let toastTimer, toastHideTimer;
function toast(msg, kind) {
  const t = $('#toast');
  clearTimeout(toastTimer);
  clearTimeout(toastHideTimer);
  // popover = capa superior: el aviso se ve incluso encima de las ventanas emergentes
  try {
    if (t.showPopover) {
      if (t.matches(':popover-open')) t.hidePopover(); // se reabre para quedar por encima de lo último que se abrió
      t.showPopover();
    }
  } catch (e) { /* navegador antiguo */ }
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  toastTimer = setTimeout(() => {
    t.className = '';
    toastHideTimer = setTimeout(() => {
      try { if (t.hidePopover && t.matches(':popover-open')) t.hidePopover(); } catch (e) { /* nada */ }
    }, 260);
  }, 4200);
}

/* ───────── Imágenes desde Drive ───────── */
const imgSrc = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
const imgFallback = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;

function makeImg(id, w, alt, opts) {
  opts = opts || {};
  const img = document.createElement('img');
  img.alt = alt || '';
  img.decoding = 'async';
  if (opts.lazy !== false) img.loading = 'lazy';
  let fallbackTried = false;
  img.addEventListener('load', () => {
    img.classList.add('ok');
    if (opts.onload) opts.onload(img);
  });
  img.addEventListener('error', () => {
    if (!fallbackTried) { fallbackTried = true; img.src = imgFallback(id, w); }
    else img.classList.add('broken');
  });
  img.src = imgSrc(id, w);
  return img;
}

/* ───────── Comunicación con Apps Script ───────── */
async function fetchJson(url, opts, timeout) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout || 30000);
  try {
    const r = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); }
    catch (e) {
      throw new ApiError('SERVER', 'El servidor respondió algo inesperado. Revisa que la implementación de Apps Script permita acceso a “Cualquier persona”.');
    }
    if (!j.ok) throw new ApiError(j.code || 'SERVER', j.message || 'Error del servidor.');
    return j;
  } catch (e) {
    if (e instanceof ApiError) throw e;
    if (e && e.name === 'AbortError') throw new ApiError('NETWORK', 'La conexión tardó demasiado. Inténtalo de nuevo.');
    throw new ApiError('NETWORK', 'No hay conexión con el servidor.');
  } finally {
    clearTimeout(timer);
  }
}

const inflight = new Map();
function apiGet(params) {
  const q = new URLSearchParams(params).toString();
  if (inflight.has(q)) return inflight.get(q);
  const p = fetchJson(CONFIG.API_URL + '?' + q).finally(() => inflight.delete(q));
  inflight.set(q, p);
  return p;
}

function postRaw(body, token, timeout) {
  return fetchJson(
    CONFIG.API_URL,
    { method: 'POST', body: JSON.stringify(Object.assign({}, body, { idToken: token })) },
    timeout || 45000
  );
}

async function post(body, timeout) {
  if (!state.admin) throw new ApiError('AUTH', 'Inicia sesión como administrador.');
  if (state.admin.exp * 1000 < Date.now() + 15000) {
    logout();
    throw new ApiError('AUTH', 'Tu sesión venció. Vuelve a entrar.');
  }
  try {
    return await postRaw(body, state.admin.token, timeout);
  } catch (e) {
    if (e.code === 'AUTH') logout();
    throw e;
  }
}

/* Muestra lo guardado al instante y actualiza en segundo plano si algo cambió. */
function swr(key, fetcher, onData, onUnchanged) {
  const ck = 'pf:' + key;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(ck)); } catch (e) { cached = null; }
  if (cached) onData(cached, false);
  return fetcher().then(
    fresh => {
      const s = JSON.stringify(fresh);
      if (!cached || JSON.stringify(cached) !== s) {
        try { localStorage.setItem(ck, s); } catch (e) { /* almacenamiento lleno: se ignora */ }
        onData(fresh, true);
      } else if (onUnchanged) {
        onUnchanged();
      }
    },
    err => { if (!cached) throw err; }
  );
}

function invalidate(keys) {
  keys.forEach(k => { try { localStorage.removeItem('pf:' + k); } catch (e) { /* nada */ } });
}

/* ───────── Contacto y "Sobre mí" ───────── */
function instagram() {
  const v = String(CONFIG.INSTAGRAM || '').trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) {
    const h = v.replace(/[?#].*$/, '').replace(/\/+$/, '').split('/').pop().replace(/^@/, '');
    return { href: v, text: h ? '@' + h : 'Instagram' };
  }
  const h = v.replace(/^@/, '');
  return { href: 'https://instagram.com/' + h, text: '@' + h };
}

function contactItems() {
  const items = [];
  if (CONFIG.CONTACT_EMAIL) items.push({ label: 'Correo', text: CONFIG.CONTACT_EMAIL, href: 'mailto:' + CONFIG.CONTACT_EMAIL });
  const ig = instagram();
  if (ig) items.push({ label: 'Instagram', text: ig.text, href: ig.href, ext: true });
  const wa = String(CONFIG.WHATSAPP || '').replace(/\D/g, '');
  if (wa) items.push({ label: 'WhatsApp', text: '+' + wa, href: 'https://wa.me/' + wa, ext: true });
  if (CONFIG.LOCATION) items.push({ label: 'Ubicación', text: CONFIG.LOCATION });
  return items;
}

const aboutParagraphs = () => String(CONFIG.ABOUT || '').split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
/* La foto subida desde la página (Admin → Foto de perfil) manda sobre ABOUT_PHOTO de config.js. */
const photoRef = () => state.profile || String(CONFIG.ABOUT_PHOTO || '').trim();
const hasAbout = () => aboutParagraphs().length > 0 || !!photoRef();

function aboutLabel() {
  if (hasAbout()) return 'Sobre mí';
  return contactItems().length ? 'Contacto' : null;
}

/* Saca el ID de Drive de un enlace de compartir (…/file/d/ID/view…), de una dirección con ?id=ID,
   o de un ID suelto (con o sin "?usp=sharing" al final). Devuelve null si es un archivo normal. */
function driveIdFrom(value) {
  const v = String(value || '').trim();
  let m = v.match(/(?:drive|docs)\.google\.com\/.*?(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
  if (m) return m[1];
  m = v.match(/^([A-Za-z0-9_-]{20,})(?:[?#].*)?$/);
  return m ? m[1] : null;
}

/* Foto circular. ABOUT_PHOTO puede ser un archivo del repositorio ('fotoperfil.jpg'),
   una dirección completa (https://…) o un enlace / ID de un archivo de Drive. */
function avatar(size, onFail) {
  const v = photoRef();
  if (!v) return null;
  const id = state.profile ? state.profile : driveIdFrom(v); // el ID que entrega el servidor siempre es de Drive
  const wrap = el('div', { class: 'avatar' + (size ? ' ' + size : '') });
  const im = document.createElement('img');
  im.alt = 'Retrato de ' + CONFIG.SITE_NAME;
  im.decoding = 'async';
  im.style.objectPosition = CONFIG.ABOUT_PHOTO_POSITION || 'center 25%';
  let tried = false;
  im.addEventListener('load', () => im.classList.add('ok'));
  im.addEventListener('error', () => {
    if (id && !tried) { tried = true; im.src = imgFallback(id, 900); return; }
    wrap.remove();
    if (onFail) onFail();
    const hint = id
      ? 'No se pudo cargar tu foto de perfil. En Drive, compártela como “Cualquier persona con el enlace” (o muévela a la carpeta Portafolio).'
      : 'No se pudo cargar tu foto de perfil. Revisa que el archivo “' + v + '” esté subido junto a index.html y que el nombre coincida.';
    console.warn(hint);
    if (state.admin) toast(hint, 'error');
  });
  im.src = id ? imgSrc(id, 900) : v;
  wrap.append(im);
  return wrap;
}

function homeAbout() {
  const paras = aboutParagraphs();
  const sec = el('section', { class: 'home-about', 'aria-labelledby': 'aboutTitle' },
    el('div', { class: 'sec-head', 'data-rv': true }, el('h2', { id: 'aboutTitle', text: 'Sobre mí' })));
  const bio = el('div', { class: 'bio', 'data-rv': true });
  const av = avatar('');
  if (av) bio.append(av);
  const tx = el('div', { class: 'bio-tx' }, el('p', { class: 'who', text: CONFIG.SITE_NAME }));
  if (paras[0]) tx.append(el('p', { text: paras[0] }));
  if (paras.length > 1 || contactItems().length) tx.append(el('a', { class: 'more', href: '#/sobre-mi', text: 'Leer más' }));
  bio.append(tx);
  sec.append(bio);
  return sec;
}

function linkFor(item, cls) {
  return el('a', { href: item.href, class: cls, target: item.ext ? '_blank' : null, rel: item.ext ? 'noopener' : null, text: item.text });
}

/* ───────── Cabecera y pie ───────── */
function renderNav() {
  const nav = $('#nav');
  nav.replaceChildren();
  state.tree.forEach(c => nav.append(el('a', { href: '#/c/' + c.id, 'data-k': 'c:' + c.id, text: c.title })));
  const label = aboutLabel();
  if (label) nav.append(el('a', { href: '#/sobre-mi', 'data-k': 'about', text: label }));
  updateNav();
}

function updateNav() {
  const v = state.view || {};
  document.querySelectorAll('#nav a').forEach(a => {
    const on = (v.type === 'about' && a.dataset.k === 'about') ||
      ((v.type === 'cat' || v.type === 'album') && a.dataset.k === 'c:' + v.catId);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

function closeMenu() {
  $('#nav').classList.remove('is-open');
  $('.top').classList.remove('menu-open');
  const b = $('#menuBtn');
  b.setAttribute('aria-expanded', 'false');
  b.textContent = 'Menú';
}

function renderFooter() {
  $('#fBrand').textContent = CONFIG.SITE_NAME;
  $('#fTag').textContent = CONFIG.TAGLINE || '';
  $('#copy').textContent = `© ${new Date().getFullYear()} ${CONFIG.SITE_NAME}. Todos los derechos reservados.`;
  const items = contactItems();
  $('#fContactCol').hidden = !items.length;
  $('#fContact').replaceChildren(...items.map(it => el('li', {}, it.href ? linkFor(it) : el('span', { class: 'plain', text: it.text }))));
  renderFooterWork();
}

function renderFooterWork() {
  const list = state.tree.map(c => el('li', {}, el('a', { href: '#/c/' + c.id, text: c.title })));
  $('#fWorkCol').hidden = !list.length;
  $('#fWork').replaceChildren(...list);
}

/* ───────── Efectos: revelado al desplazarse y portada ───────── */
let revealIO = null;
/* Los elementos con data-rv aparecen suavemente al entrar en pantalla (una vez por página). */
function reveal(scope, root) {
  if (reduceMotion || !('IntersectionObserver' in window)) return;
  const k = state.routeKey + '|' + scope;
  if (state.revealed.has(k)) return;
  state.revealed.add(k);
  if (!revealIO) {
    revealIO = new IntersectionObserver(entries => {
      let i = 0;
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.style.setProperty('--d', Math.min(i++, 6) * 70 + 'ms');
        e.target.classList.add('in');
        revealIO.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });
  }
  root.querySelectorAll('[data-rv]').forEach(n => { n.classList.add('rv'); revealIO.observe(n); });
}

const SLIDE_MS = 6500;
const hs = { el: null, timer: null, i: 0, slides: [], dots: [], cap: null, items: [], visible: true, io: null };

function heroSize() {
  const px = window.innerWidth * Math.min(window.devicePixelRatio || 1, 2);
  return Math.min(2400, Math.max(1200, Math.ceil(px / 200) * 200));
}

function heroGo(i, byUser) {
  const n = hs.slides.length;
  if (!n) return;
  const prev = hs.slides[hs.i];
  hs.i = ((i % n) + n) % n;
  const cur = hs.slides[hs.i];
  if (prev && prev !== cur) {
    prev.classList.remove('on');
    clearTimeout(prev._t);
    prev._t = setTimeout(() => prev.classList.remove('kb'), 1500); // el zoom sigue mientras se desvanece
  }
  const img = cur._load();
  const activate = () => {
    if (hs.slides[hs.i] !== cur) return; // el usuario ya cambió de imagen
    clearTimeout(cur._t);
    cur.classList.remove('kb');
    void cur.offsetWidth;
    cur.classList.add('on');
    if (!reduceMotion) cur.classList.add('kb');
  };
  if (img.complete && img.naturalWidth) activate(); else img.addEventListener('load', activate, { once: true });
  hs.slides[(hs.i + 1) % n]._load(); // precarga la siguiente
  hs.dots.forEach((d, k) => d.setAttribute('aria-current', String(k === hs.i)));
  const c = hs.items[hs.i];
  hs.cap.textContent = c.title;
  hs.cap.href = '#/c/' + c.id;
  if (byUser) heroRestart();
}

function heroRestart() {
  clearInterval(hs.timer);
  hs.timer = null;
  if (reduceMotion || hs.slides.length < 2) return;
  hs.timer = setInterval(() => {
    if (document.hidden || !hs.visible) return; // no gasta batería si no se ve
    heroGo(hs.i + 1, false);
  }, SLIDE_MS);
}

function stopHero() {
  clearInterval(hs.timer);
  hs.timer = null;
  if (hs.io) { hs.io.disconnect(); hs.io = null; }
  hs.el = null; hs.slides = []; hs.dots = []; hs.items = [];
  document.body.classList.remove('hero-on');
  $('.top').classList.remove('solid');
}

function buildHero() {
  const items = state.tree.filter(c => c.cover).slice(0, 6);
  if (!items.length) return null;
  const w = heroSize();
  hs.items = items;
  hs.i = 0;
  hs.slides = items.map((c, i) => {
    const img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    if (i === 0) img.setAttribute('fetchpriority', 'high');
    let fb = false;
    img.addEventListener('error', () => { if (!fb) { fb = true; img.src = imgFallback(c.cover, w); } });
    const slide = el('div', { class: 'slide' }, img);
    slide.style.setProperty('--kx', i % 2 ? '-1.5%' : '1.5%');
    slide._load = () => { if (!img.getAttribute('src')) img.src = imgSrc(c.cover, w); return img; };
    return slide;
  });
  hs.dots = items.map((c, i) => el('button', { class: 'dot', type: 'button', 'aria-label': 'Ver ' + c.title, onclick: () => heroGo(i, true) }));
  hs.cap = el('a', { class: 'hero-cap' });
  const label = aboutLabel();
  const goWork = () => {
    const t = document.getElementById('work');
    if (t) t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  };
  const actions = el('div', { class: 'hero-actions' },
    el('button', { class: 'btn light', type: 'button', onclick: goWork }, 'Ver trabajo'),
    label ? el('a', { class: 'btn ghost', href: '#/sobre-mi', text: label }) : null);
  const meta = el('div', { class: 'hero-meta' }, hs.cap, el('div', { class: 'dots' }, hs.dots));
  const hero = el('section', { class: 'hero', 'aria-label': 'Presentación' },
    el('div', { class: 'hero-media', 'aria-hidden': 'true' }, hs.slides),
    el('div', { class: 'hero-in' },
      el('h1', { text: CONFIG.TAGLINE || CONFIG.SITE_NAME }),
      el('div', { class: 'hero-foot' }, actions, meta)));
  hs.el = hero;
  heroGo(0, false);
  return hero;
}

function startHero() {
  document.body.classList.add('hero-on');
  heroRestart();
  if ('IntersectionObserver' in window) {
    hs.io = new IntersectionObserver(([e]) => { hs.visible = e.isIntersecting; }, { threshold: 0.1 });
    hs.io.observe(hs.el);
  }
  onScroll();
}

let scrollTick = false;
function onScroll() {
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    const top = $('.top');
    if (!hs.el) { top.classList.remove('solid'); return; }
    const h = hs.el.offsetHeight || 1;
    const y = window.scrollY;
    if (!reduceMotion) hs.el.style.setProperty('--p', Math.min(1, Math.max(0, y / h)).toFixed(3));
    top.classList.toggle('solid', y > h - 72);
  });
}

/* ───────── Rutas ───────── */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const key = parts.join('/');
  const token = ++state.token;
  const changed = key !== state.routeKey;
  if (changed) {
    window.scrollTo(0, 0);
    state.revealed.clear();
    if (revealIO) revealIO.disconnect();
    if (!reduceMotion) { main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter'); }
  }
  state.routeKey = key;
  stopHero();

  let view;
  if (parts[0] === 'c' && parts[1]) view = { type: parts[2] ? 'album' : 'cat', catId: parts[1], albumId: parts[2] };
  else if (parts[0] === 'sobre-mi') view = { type: 'about' };
  else view = { type: 'home' };
  state.view = view;
  closeMenu();
  updateNav();
  updateAdminBar();

  if (!CONFIG.API_URL) {
    if (view.type === 'about') renderAbout(); else renderSetup();
    return;
  }
  if (view.type === 'about') renderAbout(); else showSkeleton(view);
  const guard = () => token === state.token;

  swr('tree', () => apiGet({ action: 'tree' }), (data, fresh) => {
    if (!guard()) return;
    state.tree = data.categories || [];
    state.profile = data.profile || null;
    renderNav();
    renderFooterWork();
    if (view.type !== 'about') renderView(view, fresh, token);
  }, () => {
    // El servidor confirmó que no hay cambios: si el enlace no existe, avisamos.
    if (guard() && view.type !== 'about' && !resolveView(view)) renderNotFound();
  }).catch(err => { if (guard() && view.type !== 'about') renderError(err); });
}

function resolveView(view) {
  if (view.type === 'home') return {};
  const cat = state.tree.find(c => c.id === view.catId);
  if (!cat) return null;
  if (view.type === 'cat') return { cat };
  const album = cat.albums.find(a => a.id === view.albumId);
  return album ? { cat, album } : null;
}

function renderView(view, fresh, token) {
  const r = resolveView(view);
  if (!r) {
    if (fresh) renderNotFound();
    return;
  }
  if (view.type === 'home') renderHome();
  else if (view.type === 'cat') renderCategory(view, r.cat, token);
  else renderAlbum(view, r.cat, r.album, token);
}

function showSkeleton(view) {
  const w = el('div', { class: 'page', 'aria-busy': 'true' });
  w.append(el('div', { class: 'sk ' + (view.type === 'home' ? 'sk-lead' : 'sk-title') }));
  const g = el('div', { class: 'cards' });
  for (let i = 0; i < (view.type === 'home' ? 4 : 8); i++) g.append(el('div', { class: 'sk sk-card' }));
  w.append(g);
  main.replaceChildren(w);
}

function emptyState(title, text, action) {

function showPage(...kids) {

function renderWall(host, ids, folderId, title, opts) {
  host.replaceChildren();
  if (!ids.length) {
    if (opts.empty) host.append(emptyState(state.admin ? 'Vacío por ahora' : 'Sin fotos', opts.empty));
    return;
  }
  if (opts.heading) host.append(el('div', { class: 'sec-head subhead', 'data-rv': true }, el('h2', { text: opts.heading })));
  if (opts.count) host.append(el('p', { class: 'count', text: ids.length === 1 ? '1 foto' : `${ids.length} fotos` }));
  const wall = el('div', { class: 'wall' });
  ids.forEach((id, i) => {
    const open = el('button', {
      class: 'open', type: 'button',
      'aria-label': `Ver foto ${i + 1} de ${ids.length}`,
      onclick: () => openLightbox(ids, i, title),
    });
    open.append(makeImg(id, 700, `${title}, foto ${i + 1}`, {
      onload: im => { if (im.naturalWidth && im.naturalHeight) open.style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; },
    }));
    const tile = el('div', { class: 'tile', 'data-rv': true }, open);
    if (state.admin) {
      tile.append(el('button', {
        class: 'del', type: 'button', 'aria-label': 'Eliminar esta foto',
        onclick: () => deletePhoto(id, folderId),
      }, '×'));
    }
    wall.append(tile);
  });
  host.append(wall);
  reveal('wall:' + folderId, wall);
}

/* ───────── Visor ───────── */
const lb = {
  el: $('#lightbox'), img: $('#lbImg'), ids: [], i: 0, title: '',
  open: false, pushed: false, closing: false, opener: null, seq: 0,
};

function lbSize() {
  const px = Math.max(window.innerWidth, window.innerHeight) * Math.min(window.devicePixelRatio || 1, 2);
  return Math.min(2400, Math.max(800, Math.ceil(px / 200) * 200));
}

function openLightbox(ids, index, title) {
  lb.ids = ids; lb.title = title; lb.opener = document.activeElement;
  lb.open = true; lb.closing = false;
  lb.el.hidden = false;
  document.body.classList.add('lb-open');
  $('#lbTitle').textContent = title;
  history.pushState({ lb: 1 }, '');
  lb.pushed = true;
  showPhoto(index);
  $('#lbClose').focus();
}

function showPhoto(i) {
  const n = lb.ids.length;
  lb.i = ((i % n) + n) % n;
  const id = lb.ids[lb.i];
  const w = lbSize();
  const seq = ++lb.seq;
  lb.el.classList.add('loading');
  lb.img.classList.remove('ok');
  lb.img.alt = `${lb.title}, foto ${lb.i + 1} de ${n}`;
  $('#lbCount').textContent = `${lb.i + 1} / ${n}`;
  const loader = new Image();
  let triedFallback = false;
  loader.onload = () => {
    if (seq !== lb.seq) return;
    lb.img.src = loader.src;
    lb.img.classList.add('ok');
    lb.el.classList.remove('loading');
  };
  loader.onerror = () => {
    if (seq !== lb.seq) return;
    if (!triedFallback) { triedFallback = true; loader.src = imgFallback(id, w); return; }
    lb.el.classList.remove('loading');
    toast('No se pudo cargar esta foto.', 'error');
  };
  loader.src = imgSrc(id, w);
  if (n > 1) {
    [1, -1].forEach(d => { new Image().src = imgSrc(lb.ids[(lb.i + d + n) % n], w); });
  }
}

function closeLightbox() {
  if (!lb.open || lb.closing) return;
  lb.closing = true;
  if (lb.pushed) history.back(); else finishClose();
}

function finishClose() {
  lb.el.hidden = true;
  lb.open = false; lb.pushed = false; lb.closing = false; lb.seq++;
  lb.img.removeAttribute('src');
  lb.img.classList.remove('ok');
  document.body.classList.remove('lb-open');
  if (lb.opener && document.contains(lb.opener)) lb.opener.focus();
}

window.addEventListener('popstate', () => {
  if (lb.open) { lb.pushed = false; finishClose(); }
});

document.addEventListener('keydown', e => {
  if (!lb.open) {
    if (e.key === 'Escape' && $('#nav').classList.contains('is-open')) closeMenu();
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
  else if (e.key === 'ArrowRight') showPhoto(lb.i + 1);
  else if (e.key === 'ArrowLeft') showPhoto(lb.i - 1);
  else if (e.key === 'Tab') {
    const f = ['#lbClose', '#lbPrev', '#lbNext'].map(s => $(s));
    const idx = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

$('#lbClose').addEventListener('click', closeLightbox);
$('#lbPrev').addEventListener('click', () => showPhoto(lb.i - 1));
$('#lbNext').addEventListener('click', () => showPhoto(lb.i + 1));
$('#lbStage').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
(function swipe() {
  const stage = $('#lbStage');
  let sx = 0, sy = 0;
  stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showPhoto(lb.i + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();

/* ───────── Administrador: sesión ───────── */
function parseJwt(t) {
  try {
    let p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    p = p.padEnd(Math.ceil(p.length / 4) * 4, '=');
    return JSON.parse(atob(p));
  } catch (e) { return {}; }
}

function restoreAdmin() {
  try {
    const a = JSON.parse(sessionStorage.getItem('pf:admin'));
    if (a && a.token && a.exp * 1000 - Date.now() > 30000) state.admin = a;
    else sessionStorage.removeItem('pf:admin');
  } catch (e) { state.admin = null; }
}

function logout() {
  state.admin = null;
  try { sessionStorage.removeItem('pf:admin'); } catch (e) { /* nada */ }
  updateAdminBar();
  if (CONFIG.API_URL) route();
}

let gsiPromise = null;
function loadGsi() {
  if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
  if (!gsiPromise) {
    gsiPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { gsiPromise = null; reject(new Error('gsi')); };
      document.head.append(s);
    });
  }
  return gsiPromise;
}

let gsiReady = false;
async function openLogin() {
  const dlg = $('#dlgLogin'), msg = $('#loginMsg'), host = $('#gbtn');
  msg.textContent = '';
  host.replaceChildren();
  if (!dlg.open) dlg.showModal();
  if (!CONFIG.GOOGLE_CLIENT_ID) { msg.textContent = 'Falta GOOGLE_CLIENT_ID en config.js.'; return; }
  try { await loadGsi(); }
  catch (e) { msg.textContent = 'No se pudo cargar el inicio de sesión de Google. Desactiva el bloqueador de anuncios e inténtalo de nuevo.'; return; }
  if (!gsiReady) {
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: false });
    gsiReady = true;
  }
  google.accounts.id.renderButton(host, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'es', width: 280 });
}

async function onCredential(resp) {
  const msg = $('#loginMsg');
  msg.textContent = 'Verificando…';
  const token = resp && resp.credential;
  const claims = parseJwt(token || '');
  try {
    await postRaw({ action: 'verify' }, token, 45000);
    state.admin = { email: claims.email || '', exp: claims.exp || 0, token };
    try { sessionStorage.setItem('pf:admin', JSON.stringify(state.admin)); } catch (e) { /* nada */ }
    $('#dlgLogin').close();
    toast('Sesión iniciada.');
    route();
  } catch (e) {
    msg.textContent = e.code === 'FORBIDDEN'
      ? `La cuenta ${claims.email || ''} no es la del administrador.`
      : e.message;
  }
}

/* ───────── Administrador: barra y acciones ───────── */
function updateAdminBar() {
  const bar = $('#adminBar');
  if (!state.admin) {
    bar.hidden = true;
    document.body.classList.remove('has-admin');
    return;
  }
  bar.hidden = false;
  document.body.classList.add('has-admin');
  $('#adminWho').textContent = 'Modo administrador · ' + state.admin.email;
  const acts = $('#adminActions');
  acts.replaceChildren();
  const b = (text, fn, solid) => el('button', { class: 'btn' + (solid ? ' solid' : ''), type: 'button', onclick: fn }, text);
  const v = state.view || { type: 'home' };
  acts.append(refreshButton());
  if (v.type === 'home') acts.append(b('Foto de perfil', pickProfile), b('Nueva categoría', newCategory, true));
  if (v.type === 'about') acts.append(b('Foto de perfil', pickProfile, true));
  if (v.type === 'cat') acts.append(b('Nueva carpeta', newFolder), b('Subir fotos', openUpload, true));
  if (v.type === 'album') acts.append(b('Subir fotos', openUpload, true));
}

function refreshButton() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', 'M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5');
  svg.append(path);
  return el('button', { class: 'btn ico', type: 'button', 'aria-label': 'Actualizar fotos', title: 'Actualizar fotos', onclick: refreshAll },
    svg, el('span', { class: 'lbl', text: 'Actualizar' }));
}

/* Salta la memoria temporal: muestra al instante lo que se subió directo a Drive. */
async function refreshAll() {
  toast('Actualizando…');
  try {
    await post({ action: 'refresh' }, 90000);
    try {
      Object.keys(localStorage).filter(k => k.startsWith('pf:')).forEach(k => localStorage.removeItem(k));
    } catch (e) { /* nada */ }
    route();
    toast('Actualizado.');
  } catch (e) {
    toast(e.message, 'error');
    if (e.code === 'AUTH') openLogin();
  }
}

function nameDialog(opts) {
  const dlg = $('#dlgName'), form = $('#fName'), input = $('#nameInput'), err = $('#nameErr'), ok = $('#nameOk');
  $('#nameTitle').textContent = opts.title;
  $('#nameHint').textContent = opts.hint || '';
  ok.textContent = opts.ok;
  input.value = ''; err.textContent = '';
  form.onsubmit = async e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { err.textContent = 'Escribe un nombre.'; input.focus(); return; }
    ok.disabled = true;
    ok.textContent = 'Creando…';
    err.textContent = '';
    try {
      await opts.action(name);
      dlg.close();
    } catch (ex) {
      err.textContent = ex.message;
      if (ex.code === 'AUTH') { dlg.close(); openLogin(); }
    } finally {
      ok.disabled = false;
      ok.textContent = opts.ok;
    }
  };
  dlg.showModal();
  input.focus();
}

function newCategory() {
  nameDialog({
    title: 'Nueva categoría',
    hint: 'Por ejemplo: Retrato, Calle, Paisaje. Para elegir el orden, empieza con 01_, 02_… (ese número no se muestra).',
    ok: 'Crear categoría',
    action: async name => {

function newFolder() {
  const v = state.view;
  if (!v.folderId) return;
  nameDialog({
    title: 'Nueva carpeta en ' + v.label,
    hint: 'Por ejemplo, el nombre de la modelo o de la sesión.',
    ok: 'Crear carpeta',
    action: async name => {
      await post({ action: 'createFolder', parent: v.folderId, name });
      invalidate(['tree']);
      toast('Carpeta creada.');

function confirmDialog(text, okLabel) {
  return new Promise(resolve => {
    const dlg = $('#dlgConfirm');
    $('#confirmText').textContent = text;
    $('#confirmOk').textContent = okLabel;
    let settled = false;
    const done = v => { if (settled) return; settled = true; if (dlg.open) dlg.close(); resolve(v); };
    $('#confirmOk').onclick = () => done(true);
    $('#confirmNo').onclick = () => done(false);
    dlg.oncancel = () => done(false);
    dlg.showModal();
  });
}

async function deletePhoto(id, folderId) {
  const yes = await confirmDialog('La foto se moverá a la papelera de Drive y dejará de verse en la página.', 'Eliminar');
  if (!yes) return;
  try {
    await post({ action: 'trash', id });
    invalidate(['tree', 'photos:' + folderId]);
    toast('Foto eliminada.');
    route();
  } catch (e) {
    toast(e.message, 'error');
    if (e.code === 'AUTH') openLogin();
  }
}

/* ───────── Administrador: foto de perfil ───────── */
function pickProfile() {
  if (!state.admin) { openLogin(); return; }
  $('#profileInput').click();
}

async function uploadProfile(file) {
  if (!file) return;
  if (!ALLOWED.includes(file.type)) { toast('Elige una foto JPG, PNG o WebP.', 'error'); return; }
  toast('Subiendo foto de perfil…');
  try {
    const blob = await prepareImage(file, 1200);
    const data = await blobToBase64(blob);
    await post({ action: 'setProfile', mime: 'image/jpeg', data }, 120000);
    invalidate(['tree']);
    toast('Foto de perfil actualizada.');
    route();
  } catch (e) {
    toast(e.message, 'error');
    if (e.code === 'AUTH') openLogin();
  }
}

/* ───────── Administrador: subida de fotos ───────── */
const up = { items: [], running: false, folderId: null, seq: 0 };

function openUpload() {
  const v = state.view;
  if (!v.folderId) return;
  up.items = []; up.folderId = v.folderId; up.running = false;
  $('#upDest').textContent = 'Destino: ' + v.label;
  $('#upSum').textContent = '';
  $('#fileInput').value = '';
  renderUpList();
  syncUpUi();
  $('#dlgUpload').showModal();
}

function addFiles(fileList) {
  const files = Array.from(fileList || []);
  const good = files.filter(f => ALLOWED.includes(f.type));
  const skipped = files.length - good.length;
  good.forEach(f => {
    const li = el('li', {}, el('span', { class: 'fn', text: f.name }), el('span', { class: 'st', text: 'En cola' }));
    up.items.push({ id: ++up.seq, file: f, status: 'wait', li });
  });
  if (skipped) toast(`Se omitieron ${skipped} archivo(s) que no son JPG, PNG o WebP.`, 'error');
  renderUpList();
  syncUpUi();
}

function renderUpList() {
  $('#upList').replaceChildren(...up.items.map(it => it.li));
}

function setItem(it, status, text) {
  it.status = status;
  it.li.className = status === 'ok' ? 'ok' : status === 'err' ? 'bad' : '';
  $('.st', it.li).textContent = text;
}

function pending() { return up.items.filter(i => i.status !== 'ok'); }

function syncUpUi() {
  const n = pending().length;
  const anyFailed = up.items.some(i => i.status === 'err');
  const go = $('#upGo');
  go.disabled = up.running || n === 0;
  go.textContent = up.running ? 'Subiendo…' : (anyFailed ? `Reintentar (${n})` : (n ? `Subir ${n} foto${n === 1 ? '' : 's'}` : 'Subir'));
  $('#upClose').disabled = up.running;
  $('#fileInput').disabled = up.running;
}

function outName(name) {
  return (String(name).replace(/\.[^.]+$/, '') || 'foto') + '.jpg';
}

async function prepareImage(file, maxSide) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('No se pudo leer la imagen.'));
      i.src = url;
    });
    const scale = Math.min(1, (maxSide || CONFIG.MAX_SIDE) / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', CONFIG.JPEG_QUALITY));
    if (!blob) throw new Error('No se pudo procesar la imagen.');
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('No se pudo leer el archivo.'));
    r.readAsDataURL(blob);
  });
}

async function runUpload() {
  if (up.running) return;
  const queue = pending();
  if (!queue.length) return;
  up.running = true;
  syncUpUi();
  const folderId = up.folderId;
  let okCount = 0, failCount = 0, authFail = false;
  const total = queue.length;
  const sum = $('#upSum');
  sum.textContent = `Subiendo 0 de ${total}…`;

  async function worker() {
    while (queue.length && !authFail) {
      const it = queue.shift();
      try {
        setItem(it, 'work', 'Preparando…');
        const blob = await prepareImage(it.file);
        setItem(it, 'work', 'Subiendo…');
        const data = await blobToBase64(blob);
        await post({ action: 'upload', folder: folderId, name: outName(it.file.name), mime: 'image/jpeg', data }, 120000);
        setItem(it, 'ok', 'Listo');
        okCount++;
      } catch (e) {
        failCount++;
        if (e.code === 'AUTH') { authFail = true; setItem(it, 'err', 'Sesión vencida'); }
        else setItem(it, 'err', e.message);
      }
      sum.textContent = `Subiendo ${okCount + failCount} de ${total}…`;
    }
  }
  await Promise.all([worker(), worker()]);

  up.running = false;
  syncUpUi();
  if (okCount) {
    invalidate(['tree', 'photos:' + folderId]);
    route();
  }
  if (authFail) {
    sum.textContent = 'Tu sesión venció. Entra de nuevo y pulsa Reintentar.';
    openLogin();
  } else if (failCount) {
    sum.textContent = `${okCount} subida${okCount === 1 ? '' : 's'}, ${failCount} con error. Puedes reintentar.`;
  } else {
    toast(okCount === 1 ? 'Foto subida.' : `${okCount} fotos subidas.`);
    $('#dlgUpload').close();
  }
}

/* ───────── Arranque ───────── */
function init() {
  $('#brand').textContent = CONFIG.SITE_NAME;
  renderFooter();
  renderNav();
  restoreAdmin();

  $('#menuBtn').addEventListener('click', () => {
    const open = $('#nav').classList.toggle('is-open');
    $('.top').classList.toggle('menu-open', open);
    $('#menuBtn').setAttribute('aria-expanded', String(open));
    $('#menuBtn').textContent = open ? 'Cerrar' : 'Menú';
  });
  $('#adminLink').addEventListener('click', () => { if (state.admin) toast('Ya estás en modo administrador.'); else openLogin(); });
  $('#adminOut').addEventListener('click', () => { logout(); toast('Sesión cerrada.'); });
  $('#loginCancel').addEventListener('click', () => $('#dlgLogin').close());
  $('#nameCancel').addEventListener('click', () => $('#dlgName').close());
  $('#upClose').addEventListener('click', () => $('#dlgUpload').close());
  $('#upGo').addEventListener('click', runUpload);
  $('#dlgUpload').addEventListener('cancel', e => { if (up.running) e.preventDefault(); });
  $('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#profileInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; uploadProfile(f); });

  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { if (!up.running) addFiles(e.dataTransfer.files); });
  drop.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !up.running) { e.preventDefault(); $('#fileInput').click(); } });

  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });
  route();
}

init();
</script>
