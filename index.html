<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafolio de fotografía</title>
<meta name="description" content="Portafolio de fotografía.">
<meta name="theme-color" content="#333332">
<meta name="robots" content="noimageindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23333332'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23efeee9' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wdth,wght@75..100,200..800&family=Newsreader:ital,wght@0,400;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* ───────── Sistema de diseño ─────────
   Base: gris medio neutro, para que el color de las fotos se vea fiel.
   Tipografía: Bricolage Grotesque (títulos condensados y ligeros; resto en ancho normal)
   y Newsreader cursiva solo para datos secundarios (contadores).
   Estructura: contenedor de 1360 px, escala de espacio de 8 px, filetes finos para separar secciones. */
:root{
  --gris-12:#2a2a29;
  --gris-18:#333332;
  --gris-25:#454543;
  --marfil:#efeee9;
  --humo:#a8a7a1;
  --tinta:#1d1d1c;
  --error:#a3261c;
  --linea:rgba(239,238,233,.16);
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --titular:'Fraunces','Newsreader',Georgia,serif;   /* letra de los títulos: elegante y con carácter, para que destaque */
  --script:'Mrs Saint Delafield','Newsreader',cursive;  /* caligrafía fina, como una firma, para el texto de la portada */
  --pad:clamp(16px,4vw,40px);
  --max:1360px;
  --seccion:clamp(48px,7vw,96px);
  --cabecera:64px;
  --gl:max(var(--pad),env(safe-area-inset-left,0px));   /* margen izquierdo, respeta muescas */
  --gr:max(var(--pad),env(safe-area-inset-right,0px));  /* margen derecho */
}
@media (min-width:1800px){:root{--max:1600px}html{font-size:17px}}
@media (min-width:2400px){:root{--max:1900px}html{font-size:19px}}
@media (min-width:3200px){:root{--max:2400px}html{font-size:24px}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--gris-18);color:var(--marfil);font-family:var(--display);font-size:1rem;line-height:1.5}
body.lb-open{overflow:hidden}
body.has-admin{padding-bottom:var(--bar-h,76px)}
main{flex:1}
main:focus{outline:none}
img{max-width:100%}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--marfil);outline-offset:3px}
dialog :focus-visible,.admin-bar :focus-visible{outline-color:var(--tinta)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--marfil);color:var(--tinta);padding:.6em 1em}
.skip:focus{left:8px}
.page{max-width:var(--max);margin:0 auto;padding:0 var(--gr) 0 var(--gl)}

/* Cabecera fija con menú */
.top{position:sticky;top:0;z-index:30;background:var(--gris-18);box-shadow:0 1px 0 var(--linea);transition:background-color .35s,box-shadow .35s}
.top-in{max-width:var(--max);margin:0 auto;padding:0 var(--gr) 0 var(--gl);height:var(--cabecera);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{padding:11px 0;font-weight:600;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.nav{display:flex;align-items:center;gap:28px}
.nav a{padding:8px 0;border-bottom:1.5px solid transparent;color:var(--humo);font-size:.95rem;text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--marfil)}
.nav a[aria-current]{color:var(--marfil);border-bottom-color:var(--marfil)}
.menu-btn{display:none;min-height:44px;padding:0 4px;border:0;background:none;color:inherit;font-weight:500;cursor:pointer}
/* Menú desplegable: en pantallas ≤ 820 px, o cuando los enlaces ya no caben en la cabecera */
.top.compact .menu-btn{display:inline-flex;align-items:center}
.top.compact .nav{position:absolute;left:0;right:0;top:100%;display:none;flex-direction:column;align-items:stretch;gap:0;padding:4px max(var(--gr),calc((100% - var(--max)) / 2 + var(--gr))) 12px max(var(--gl),calc((100% - var(--max)) / 2 + var(--gl)));background:var(--gris-18);box-shadow:0 1px 0 var(--linea);max-height:calc(100vh - var(--cabecera));max-height:calc(100dvh - var(--cabecera));overflow-y:auto;overscroll-behavior:contain}
.top.compact .nav.is-open{display:flex}
.top.compact .nav a{padding:14px 0;border-bottom:1px solid var(--linea);font-size:1.05rem;white-space:normal}
.top.compact .nav a:last-child{border-bottom:0}
.top.compact .nav a[aria-current]{border-bottom-color:var(--linea);font-weight:600}

/* Cabecera de página (migas + título) */
.page-head{padding:24px 0}
.crumbs{color:var(--humo);font-size:.9rem}
.crumbs a{text-underline-offset:3px}
.crumbs a:hover{color:var(--marfil)}
.crumbs .sep{margin:0 .5em}
.crumbs [aria-current]{color:var(--marfil)}
.title{margin:.3em 0 .1em;font-family:var(--titular);font-style:italic;font-optical-sizing:auto;font-size:clamp(2.5rem,7vw,4.75rem);font-weight:460;line-height:1.02;letter-spacing:-.005em;overflow-wrap:break-word}
.count{margin:-8px 0 24px;font-family:var(--serif);font-style:italic;color:var(--humo)}

/* Inicio */
.intro{padding:clamp(40px,8vw,96px) 0 clamp(32px,5vw,64px)}
.lead{margin:0;max-width:24em;font-family:var(--titular);font-style:italic;font-optical-sizing:auto;font-size:clamp(1.9rem,5vw,3.75rem);font-weight:460;line-height:1.06;letter-spacing:-.005em}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 24px;padding-bottom:12px;border-bottom:1px solid var(--linea)}
.sec-head h2{margin:0;font-size:1.25rem;font-weight:600}

/* Cuadrícula uniforme (categorías y carpetas) */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:28px 16px}
.cards:has(>.card:only-child){max-width:min(100%,380px)}
.card{display:block;text-decoration:none}
.card .ph{position:relative;aspect-ratio:4/5;background:var(--gris-12);overflow:hidden;transition:aspect-ratio .3s ease}
.card .ph::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(20,20,19,0);transition:background .5s}
.card img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .7s cubic-bezier(.2,.7,.2,1)}
.card img.ok{opacity:1}
.card img.broken{display:none}
.card .nm{display:inline-block;margin-top:12px;padding-bottom:3px;font-family:var(--titular);font-size:1.1875rem;font-weight:500;line-height:1.3;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .4s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.card:hover img.ok{transform:scale(1.06)}.card:hover .ph::after{background:rgba(20,20,19,.22)}.card:hover .nm,.card:focus-visible .nm{background-size:100% 1px}}
@media (min-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 24px}}
@media (min-width:900px){.cards{grid-template-columns:repeat(auto-fit,minmax(max(180px,calc((100% - 72px) / 4 - .5px)),1fr))}}
@media (min-width:2000px){.cards{grid-template-columns:repeat(auto-fit,minmax(max(180px,calc((100% - 96px) / 5 - .5px)),1fr))}}

/* Galería de fotos */
.sec-head.subhead{margin-top:var(--seccion)}
.wall{column-width:130px;column-gap:12px}
.tile{position:relative;break-inside:avoid;margin:0 0 12px}
.open{display:block;width:100%;padding:0;border:0;background:var(--gris-12);cursor:zoom-in;aspect-ratio:3/4;overflow:hidden}
.open img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s,transform .7s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.open:hover img.ok{transform:scale(1.04)}}
.open img.ok{opacity:1}
.open img.broken{display:none}
.del{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:50%;background:var(--marfil);color:var(--tinta);font-size:22px;line-height:1;cursor:pointer}
.del:hover{background:#fff}
@media (min-width:700px){.wall{column-width:200px;column-gap:16px}.tile{margin-bottom:16px}}
@media (min-width:1800px){.wall{column-width:260px}}

.pager{display:flex;justify-content:space-between;gap:16px;margin-top:var(--seccion);padding-top:20px;border-top:1px solid var(--linea)}
.pager a{display:block;font-weight:500;text-decoration:none}
.pager a:hover{text-decoration:underline;text-underline-offset:4px}
.pager .lbl{display:block;color:var(--humo);font-size:.85rem;font-weight:400}
.pager .next{margin-left:auto;text-align:right}

/* Foto circular del fotógrafo */
.avatar{--av:136px;width:var(--av);height:var(--av);flex:none;margin:7px;border-radius:50%;overflow:hidden;background:var(--gris-12);box-shadow:0 0 0 6px var(--gris-18),0 0 0 7px rgba(239,238,233,.4)}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.avatar img.ok{opacity:1}
.avatar.lg{--av:184px}
@media (min-width:700px){.avatar{--av:176px}.avatar.lg{--av:300px}}

/* Sobre mí en el inicio */
.home-about{margin-top:var(--seccion)}
.bio{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-top:8px}
.bio-tx{min-width:0}
@media (min-width:700px){.bio{flex-direction:row;align-items:center;gap:48px}}

/* Texto del fotógrafo (inicio y página Sobre mí) */
.bio-tx p,.about-tx p{max-width:60ch;margin:0 0 1em;font-size:1.0625rem;line-height:1.65}
.bio-tx .who,.about-tx .who{margin:0 0 .35em;font-family:var(--titular);font-style:italic;font-size:1.6rem;font-weight:560;line-height:1.2}
.more{display:inline-block;padding:8px 0;font-weight:500;text-underline-offset:4px}
.more:hover{color:var(--humo)}

/* Página Sobre mí */
.about{display:grid;gap:24px;align-items:start;padding-top:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;max-width:60ch;margin:32px 0 0;padding-top:20px;border-top:1px solid var(--linea)}
.facts dt{color:var(--humo)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts a{text-underline-offset:3px}
@media (min-width:800px){
  .about{grid-template-columns:auto minmax(0,1fr);gap:72px}
  .about.solo{grid-template-columns:minmax(0,1fr);max-width:48rem}
}

/* Estados vacíos y de carga */
.empty{max-width:46rem;padding:clamp(40px,10vh,96px) 0}
.empty h2{margin:0 0 .3em;font-family:var(--titular);font-style:italic;font-optical-sizing:auto;font-size:clamp(2rem,6vw,3.5rem);font-weight:460;line-height:1.05;letter-spacing:-.01em}
.empty p{margin:0 0 1.2em;color:var(--humo);max-width:36rem}
.sk{background:linear-gradient(90deg,var(--gris-12),var(--gris-25),var(--gris-12));background-size:200% 100%;animation:sh 1.6s linear infinite}
.sk-lead{height:clamp(56px,10vw,120px);max-width:60%;margin:clamp(40px,8vw,96px) 0 clamp(32px,5vw,64px)}
.sk-title{height:clamp(48px,8vw,80px);max-width:40%;margin:56px 0 32px}
.sk-card{aspect-ratio:4/5}
@keyframes sh{to{background-position:-200% 0}}

/* Pie */
.foot{margin-top:var(--seccion);border-top:1px solid var(--linea);color:var(--humo);font-size:.925rem}
.foot-in{max-width:var(--max);margin:0 auto;padding:40px var(--gr) 24px var(--gl)}
.foot-grid{display:grid;gap:32px;grid-template-columns:1fr}
.foot h2{margin:0 0 12px;font-size:.9rem;font-weight:600;color:var(--marfil)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.foot li a,.foot li .plain{display:inline-block;padding:4px 0;text-decoration:none}
.foot li a:hover,.foot-base a:hover{color:var(--marfil);text-decoration:underline;text-underline-offset:3px}
.foot .wm{margin:0 0 8px;color:var(--marfil);font-weight:600;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase}
.foot .tag{margin:0;max-width:28rem}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:32px;padding-top:16px;border-top:1px solid var(--linea);font-size:.85rem}
.linklike{background:none;border:0;color:inherit;cursor:pointer;padding:.7em 0;text-decoration:underline;text-underline-offset:3px}
.linklike:hover{color:var(--marfil)}
@media (min-width:700px){.foot-grid{grid-template-columns:2fr 1fr 1fr}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55em 1.1em;border:1.5px solid currentColor;border-radius:2px;background:transparent;color:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--tinta);border-color:var(--tinta);color:var(--marfil)}
.btn{transition:background-color .25s,color .25s,border-color .25s}
.btn.light{background:var(--marfil);border-color:var(--marfil);color:var(--tinta)}
.btn.light:hover{background:#fff;border-color:#fff}
.btn.ghost{border-color:rgba(239,238,233,.7);background:rgba(20,20,19,.25);color:var(--marfil)}
.btn.ghost:hover{background:var(--marfil);border-color:var(--marfil);color:var(--tinta)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ico{min-width:44px;padding:0 12px;gap:8px}
.btn.ico svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ico .lbl{display:none}
@media (min-width:641px){.btn.ico .lbl{display:inline}}

/* Barra de administrador */
.admin-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom)) var(--gl);background:var(--marfil);color:var(--tinta)}
.admin-bar[hidden]{display:none}
.admin-bar .who{font-size:.9rem;color:#57564f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.admin-bar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.admin-bar .linklike{color:var(--tinta)}
@media (max-width:640px){.admin-bar .who{display:none}.admin-bar{justify-content:flex-end}}

/* Ventanas de diálogo */
dialog{width:min(92vw,460px);max-height:90vh;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;border:0;border-radius:2px;background:var(--marfil);color:var(--tinta)}
dialog::backdrop{background:rgba(20,20,19,.72)}
dialog h2{margin:0 0 .4em;font-size:1.5rem;font-weight:600;line-height:1.2}
dialog p{margin:0 0 1em}
dialog .hint{color:#57564f;font-size:.95rem}
dialog label{display:block;font-weight:600;margin-bottom:.35em}
dialog input[type=text]{width:100%;min-height:46px;padding:.5em .7em;border:1.5px solid var(--tinta);border-radius:2px;background:#fff;color:var(--tinta);font:inherit}
dialog .err{min-height:1.4em;margin:.5em 0 0;color:var(--error);font-size:.95rem}
dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.gbtn{min-height:44px;display:flex;justify-content:center;margin:12px 0}
.drop{display:flex;align-items:center;justify-content:center;min-height:120px;padding:16px;border:2px dashed #8b8a83;border-radius:2px;text-align:center;font-weight:500;cursor:pointer}
.drop.over{background:#fff;border-color:var(--tinta)}
.uplist{list-style:none;margin:14px 0 0;padding:0;max-height:32vh;overflow:auto}
.uplist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #d3d2cb;font-size:.92rem}
.uplist .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.uplist .st{flex:none;color:#57564f}
.uplist .ok .st{color:#1f6b3a}
.uplist .bad .st{color:var(--error)}
.upsum{margin:12px 0 0;color:#57564f;font-size:.95rem;min-height:1.4em}

/* Visor de fotos */
.lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;flex-direction:column;background:rgba(22,22,21,.98)}
.lb[hidden]{display:none}
.lb-stage{position:relative;flex:1;min-height:0;margin:0;display:flex;align-items:center;justify-content:center;padding:56px 0 4px}
.lb:not([hidden]){animation:fade .3s ease}
.lb-stage canvas{display:block;max-width:100%;max-height:calc(100vh - 118px);max-height:calc(100dvh - 118px);opacity:0;transform:scale(.985);transition:opacity .35s,transform .5s cubic-bezier(.2,.7,.2,1)}
.lb-stage canvas.ok{opacity:1;transform:none}
.lb.loading .lb-stage::after{content:"";position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:2px solid rgba(239,238,233,.25);border-top-color:var(--marfil);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lb-btn{position:absolute;z-index:2;width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(239,238,233,.12);color:var(--marfil);cursor:pointer}
.lb-btn:hover{background:rgba(239,238,233,.25)}
.lb-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-close{top:calc(8px + env(safe-area-inset-top));right:8px}
.lb-prev{left:8px;top:50%;margin-top:-24px}
.lb-next{right:8px;top:50%;margin-top:-24px}
.lb-bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px var(--gr) calc(12px + env(safe-area-inset-bottom)) var(--gl);color:var(--humo);font-size:.95rem}
.lb-count{font-family:var(--serif);font-style:italic}

/* Avisos */
#toast{position:fixed;top:auto;right:auto;bottom:24px;left:50%;z-index:80;margin:0;width:max-content;height:auto;overflow:visible;transform:translateX(-50%);max-width:min(92vw,440px);padding:.7em 1.1em;border:0;border-radius:2px;background:var(--marfil);color:var(--tinta);font:inherit;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.error{background:var(--error);color:#fff}
body.has-admin #toast{bottom:calc(var(--bar-h,76px) + 12px)}

/* Portada del inicio: fotos de tus categorías con zoom lento y desvanecido */
.hero{position:relative;margin-top:calc(var(--cabecera) * -1);height:clamp(480px,88vh,880px);height:clamp(480px,88svh,880px);overflow:hidden;background:var(--gris-12);color:var(--marfil)}
.hero-media{position:absolute;left:0;right:0;top:-80px;bottom:0;transform:translate3d(0,calc(var(--p,0) * 80px),0);will-change:transform}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity 1.3s ease}
.slide.on{opacity:1}
.slide img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.slide.kb img{animation:kb 9s cubic-bezier(.25,.6,.3,1) forwards}
@keyframes kb{from{transform:scale(1.13) translate3d(var(--kx,1.5%),1%,0)}to{transform:scale(1) translate3d(0,0,0)}}
.hero::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(to bottom,rgba(20,20,19,.6) 0,rgba(20,20,19,0) 24%),linear-gradient(to top,rgba(20,20,19,.82) 0,rgba(20,20,19,.25) 45%,rgba(20,20,19,0) 70%)}
.hero-in{position:relative;z-index:2;height:100%;max-width:var(--max);margin:0 auto;padding:0 var(--gr) clamp(28px,5vw,56px) var(--gl);display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(20px,3vw,32px);opacity:calc(1 - var(--p,0) * 1.15);transform:translate3d(0,calc(var(--p,0) * -28px),0)}

.hero h1{margin:0;max-width:20em;display:flex;flex-direction:column;align-items:flex-start;text-shadow:0 2px 30px rgba(20,20,19,.4);animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-kicker{font-family:var(--titular);font-style:italic;font-optical-sizing:auto;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(1.05rem,2.5vw,1.9rem);font-weight:560;line-height:1.3;opacity:.94}
.hero-script{font-family:var(--script);font-weight:400;font-style:normal;font-size:clamp(3.6rem,10.5vw,8.5rem);line-height:1.05;margin-top:.08em}

.hero-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 24px;animation:rise .9s .35s cubic-bezier(.2,.7,.2,1) both}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.hero-cap{font-family:var(--serif);font-style:italic;font-size:1.1rem;text-decoration:none;text-underline-offset:4px}
.hero-cap:hover{text-decoration:underline}
.dots{display:flex;align-items:center}
.dot{position:relative;width:40px;height:44px;padding:0;border:0;background:none;cursor:pointer}
.dot::before,.dot::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px}
.dot::before{background:rgba(239,238,233,.35)}
.dot::after{right:auto;width:0;background:var(--marfil)}
.dot[aria-current="true"]::after{width:calc(100% - 8px);transition:width 6.5s linear}
[id=work]{scroll-margin-top:var(--cabecera)}
.after-hero{padding-top:var(--seccion)}

/* La cabecera es transparente sobre la portada y se vuelve sólida al bajar */
body.hero-on .top:not(.solid):not(.menu-open){background:transparent;box-shadow:0 1px 0 transparent}
body.hero-on .top:not(.solid):not(.menu-open) .nav a{color:rgba(239,238,233,.88)}
body.hero-on .top:not(.solid):not(.menu-open) .nav a:hover,body.hero-on .top:not(.solid):not(.menu-open) .nav a[aria-current]{color:#fff}
body.hero-on .top:not(.solid):not(.menu-open) .nav a[aria-current]{border-bottom-color:#fff}

/* Imágenes del sitio: fondo, logo y firma */
#bg{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:-1;overflow:hidden;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.bg-fill,.bg-par,.bg-img{position:absolute;top:0;right:0;bottom:0;left:0}
.bg-fill,.bg-img{background-position:center;background-repeat:no-repeat}
.bg-fill{background-size:cover;filter:blur(26px) saturate(115%);transform:scale(1.15)}   /* relleno desenfocado: no deja bordes vacíos */
.bg-par{transform:translate3d(0,var(--bgy,0px),0) scale(var(--bgs,1));transform-origin:center}
.bg-img{background-size:contain}                                                       /* la imagen completa, sin recortarla */
#bg .bg-img.feather{-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
#bg.cover .bg-fill{display:none}
#bg.cover .bg-img{background-size:cover}
#bg.move .bg-img{animation:bgdrift 46s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.08) translate3d(-1.2%,-.9%,0)}}
#bg.on{opacity:1}
#bg::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(51,51,50,var(--bg-dim,.82))}
body.has-bg .top{background:rgba(51,51,50,.72)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  body.has-bg .top{-webkit-backdrop-filter:blur(14px) saturate(115%);backdrop-filter:blur(14px) saturate(115%)}
}
body.has-bg .top.compact .nav{background:rgba(51,51,50,.97)}
body.hero-on .top:not(.solid):not(.menu-open){-webkit-backdrop-filter:none;backdrop-filter:none}
.brand.has-logo{display:flex;align-items:center;min-height:44px;padding:0}
.brand-logo{display:block;height:var(--logo-h);width:auto;max-width:min(320px,56vw);object-fit:contain}
:root{--logo-h:var(--logo-cfg,52px)}
@media (min-width:1800px){:root{--logo-h:calc(var(--logo-cfg,52px) * 1.15)}}
@media (max-height:520px){:root{--logo-h:min(var(--logo-cfg,52px),34px)}}
body.has-logo{--cabecera:calc(var(--logo-h) + 24px)}   /* la cabecera crece con el logo */
.hero-mid{position:relative;flex:1 1 auto;min-height:0;padding-top:var(--cabecera);pointer-events:none}
.hero-sign{position:absolute;left:50%;top:calc(50% + var(--cabecera) / 2);transform:translate(-50%,-50%);width:clamp(10rem,32vw,26rem);max-width:80%;max-height:calc(100% - var(--cabecera) - 8px);object-fit:contain;filter:drop-shadow(0 2px 16px rgba(20,20,19,.5));animation:sign 1.9s .5s cubic-bezier(.5,.1,.2,1) backwards}
@keyframes sign{from{clip-path:inset(-40px 100% -40px -40px);opacity:0}12%{opacity:1}to{clip-path:inset(-40px -40px -40px -40px);opacity:1}}

/* Protección de las fotos: sin clic derecho, sin guardar al mantener pulsado, sin arrastrar, sin imprimir */
html.protect .tile,html.protect .card,html.protect .open,html.protect .hero,html.protect #lightbox,html.protect .avatar,html.protect .brand,html.protect .hero-sign,html.protect #bg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.protect img{pointer-events:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.protect #lbImg{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media print{
  html.protect body *{display:none!important}
  html.protect body::before{content:var(--print-msg,"Contenido protegido");display:block;padding:2em;font:16px/1.5 Arial,sans-serif;color:#000}
}

/* Contacto rápido: logos pegados al borde derecho que acompañan el desplazamiento */
.dock{--dk:52px;position:fixed;z-index:35;right:max(12px,env(safe-area-inset-right,0px));top:0;width:0;height:100vh;height:100dvh;pointer-events:none}
.dock[hidden]{display:none}
.dock-in{position:absolute;right:0;top:calc(36% + var(--prog,0) * 28%);transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.dk{position:relative;display:flex;align-items:center;justify-content:flex-end;height:var(--dk);pointer-events:auto;color:#fff;text-decoration:none;transform:translate3d(0,var(--dy,0px),0) rotate(var(--rot,0deg));will-change:transform}
.dk-ic{position:relative;isolation:isolate;flex:none;width:var(--dk);height:var(--dk);display:grid;place-items:center;border-radius:50%;box-shadow:0 8px 22px rgba(0,0,0,.38);transition:box-shadow .35s;animation:dkin .8s calc(.9s + var(--i,0) * .16s) cubic-bezier(.2,1.4,.4,1) backwards,dkbob 4.6s calc(1.9s + var(--i,0) * .7s) ease-in-out infinite}
.dk-ic svg{width:calc(var(--dk) * .5);height:calc(var(--dk) * .5);display:block;transition:transform .45s cubic-bezier(.2,1.5,.4,1)}
.dk-wa .dk-ic{background:#25d366}
.dk-ig .dk-ic{background:radial-gradient(circle at 30% 107%,#fdf497 0,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.dk-ml .dk-ic{background:var(--marfil);color:var(--tinta)}
.dk-wa .dk-ic::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1;border-radius:50%;background:#25d366;animation:dkpulse 2.4s ease-out infinite}
.dk-ig .dk-ic::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 68%) 150% 0/250% 100% no-repeat;animation:dkshine 3.8s ease-in-out infinite}
.dk-label{position:absolute;right:calc(var(--dk) + 12px);padding:.55em 1em;border-radius:999px;background:rgba(20,20,19,.9);color:var(--marfil);font-size:.9rem;font-weight:600;white-space:nowrap;opacity:0;transform:translate3d(14px,0,0) scale(.96);transition:opacity .3s,transform .4s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
.dk:hover .dk-label,.dk:focus-visible .dk-label,.dock.intro .dk-label{opacity:1;transform:none}
.dk:hover .dk-ic,.dk:focus-visible .dk-ic{box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.16)}
.dk:hover .dk-ic svg,.dk:focus-visible .dk-ic svg{transform:scale(1.18) rotate(-9deg)}
.dk:focus-visible{outline:none}
.dk:focus-visible .dk-ic{outline:2px solid #fff;outline-offset:4px}
@keyframes dkin{from{opacity:0;transform:translate3d(90px,0,0) scale(.4)}}
@keyframes dkbob{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-4px,0)}}
@keyframes dkpulse{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.85);opacity:0}}
@keyframes dkshine{to{background-position:-50% 0}}
@media (pointer:coarse){.dock{--dk:46px}}
@media (max-width:380px){.dock{--dk:42px}.dock-in{gap:10px;top:calc(27% + var(--prog,0) * 33%)}}
@media (max-width:320px){.dock{--dk:40px}.dock-in{gap:8px;top:calc(19% + var(--prog,0) * 41%)}}
@media (max-height:520px){.dock{--dk:40px}.dock-in{gap:8px;top:calc(34% + var(--prog,0) * 24%)}}
@media print{.dock{display:none!important}}

/* Efectos de entrada */
main.enter{animation:rise .5s cubic-bezier(.2,.7,.2,1)}
.rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Monitores grandes en horizontal: la portada aprovecha mejor la altura */
@media (orientation:landscape) and (min-height:900px){.hero{height:clamp(480px,88vh,1300px);height:clamp(480px,88svh,1300px)}}

/* Celular en horizontal u otras pantallas bajas */
@media (max-height:520px){
  :root{--cabecera:52px}
  .hero{height:100vh;height:100svh;min-height:300px}
  .hero-kicker{font-size:clamp(.9rem,3vw,1.3rem)}
  .hero-script{font-size:clamp(2.4rem,8vw,3.75rem);line-height:1}
  .hero-in{gap:14px;padding-bottom:22px}
  .hero-foot{align-items:center}
  .lb-stage{padding-top:8px}
  .lb-stage canvas{max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px)}
  .lb-bar{padding-top:2px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .title{font-size:clamp(2.25rem,7vw,3.5rem)}
}

/* Pantallas táctiles: objetivos de toque de al menos 44 px */
@media (pointer:coarse){
  a,button,label[for]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .nav a{padding:12px 0}
  .crumbs a{display:inline-block;padding:12px 2px}
  .page-head{padding-top:10px}
  .pager a{padding:10px 0}
  .more{padding:13px 0}
  .hero-cap{display:inline-block;padding:12px 0}
  .foot li a,.foot li .plain{padding:11px 0}
  .linklike{min-height:44px;display:inline-flex;align-items:center}
  .btn:active,.dot:active,.linklike:active{opacity:.75}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .lb.loading .lb-stage::after{border-top-color:rgba(239,238,233,.25)}
  .hero-media,.hero-in{transform:none!important}
  #bg{transition:none}
  .dk{transform:none!important}
  .dot[aria-current="true"]::after{width:calc(100% - 8px)}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="bg-fill"></div><div class="bg-par"><div class="bg-img"></div></div></div>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="top">
  <div class="top-in">
    <a class="brand" id="brand" href="#/">Portafolio</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">Menú</button>
    <nav class="nav" id="nav" aria-label="Principal"></nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><div class="page"><div class="empty"><h2>Se necesita JavaScript</h2><p>Activa JavaScript en tu navegador para ver el portafolio.</p></div></div></noscript>
</main>

<footer class="foot">
  <div class="foot-in">
    <div class="foot-grid">
      <div>
        <p class="wm" id="fBrand"></p>
        <p class="tag" id="fTag"></p>
      </div>
      <nav id="fWorkCol" aria-label="Trabajo" hidden><h2>Trabajo</h2><ul id="fWork"></ul></nav>
      <div id="fContactCol" hidden><h2>Contacto</h2><ul id="fContact"></ul></div>
    </div>

      <button class="linklike" id="adminLink" type="button">Admin</button>

<div class="admin-bar" id="adminBar" hidden>

<!-- Nombre de carpeta -->

    <button class="btn" type="button" id="confirmNo">Cancelar</button>

<!-- Visor -->
<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Visor de fotos" hidden>
  <figure class="lb-stage" id="lbStage">
    <canvas id="lbImg" role="img" aria-label=""></canvas>

<input type="file" id="profileInput" accept="image/jpeg,image/png,image/webp" hidden>

<aside class="dock" id="dock" aria-label="Contacto rápido" hidden></aside>

<!-- Tus datos personales viven en config.js -->
<script src="config.js"></script>
<script>
'use strict';

const CONFIG = Object.assign({
  API_URL: 'https://script.google.com/macros/s/AKfycbyZDFd0fZcWbYR9buN_Lbzq6ApLi09s_LhumJe5X4zVE02pDhikAYh9NtiqahxPUU_FYA/exec', GOOGLE_CLIENT_ID: '422500526386-30n229h03ksvj068f9eom2edvhqo051g.apps.googleusercontent.com',
  SITE_NAME: 'Portafolio', TAGLINE: '',
  ABOUT: '', ABOUT_PHOTO: '', ABOUT_PHOTO_POSITION: 'center 25%',
  CONTACT_EMAIL: '', INSTAGRAM: '', WHATSAPP: '', LOCATION: '',
  BACKGROUND_IMAGE: '', BACKGROUND_DIM: 0.82,
  BACKGROUND_SIZE: 'auto', BACKGROUND_SCALE: 1, BACKGROUND_EFFECT: 'movimiento',
  LOGO_IMAGE: '', LOGO_MODE: 'auto', LOGO_HEIGHT: 52,
  SIGNATURE_IMAGE: '', SIGNATURE_MODE: 'auto',
  MAX_SIDE: 2000,       // lado mayor (px) al que se reducen las fotos antes de subirlas
  MAX_VIEW_PX: 2000,    // lado mayor (px) de las fotos que ve el público (menos = más protegidas)
  DOCK: true, WHATSAPP_MESSAGE: '',
  PROTECT: true, WATERMARK: true, WATERMARK_TEXT: '', WATERMARK_OPACITY: 0.22,
  JPEG_QUALITY: 0.86,
}, window.PORTFOLIO_CONFIG || {});

const $ = (s, r) => (r || document).querySelector(s);
const main = $('#main');
const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];
const state = { tree: [], profile: null, assets: {}, admin: null, view: { type: 'home' }, token: 0, routeKey: null, revealed: new Set() };
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

class ApiError extends Error {
  constructor(code, message) { super(message); this.code = code; }
}

/* ───────── Utilidades de DOM ───────── */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}

let toastTimer, toastHideTimer;
function toast(msg, kind) {
  const t = $('#toast');
  clearTimeout(toastTimer);
  clearTimeout(toastHideTimer);
  // popover = capa superior: el aviso se ve incluso encima de las ventanas emergentes
  try {
    if (t.showPopover) {
      if (t.matches(':popover-open')) t.hidePopover(); // se reabre para quedar por encima de lo último que se abrió
      t.showPopover();
    }
  } catch (e) { /* navegador antiguo */ }
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  toastTimer = setTimeout(() => {
    t.className = '';
    toastHideTimer = setTimeout(() => {
      try { if (t.hidePopover && t.matches(':popover-open')) t.hidePopover(); } catch (e) { /* nada */ }
    }, 260);
  }, 4200);
}

/* ───────── Imágenes desde Drive ───────── */
const imgSrc = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
const imgFallback = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;

function makeImg(id, w, alt, opts) {
  opts = opts || {};
  const img = document.createElement('img');
  img.alt = alt || '';
  img.decoding = 'async';
  if (opts.lazy !== false) img.loading = 'lazy';
  let fallbackTried = false;
  img.addEventListener('load', () => {
    img.classList.add('ok');
    if (opts.onload) opts.onload(img);
  });
  img.addEventListener('error', () => {
    if (!fallbackTried) { fallbackTried = true; img.src = imgFallback(id, w); }
    else img.classList.add('broken');
  });
  img.src = imgSrc(id, w);
  return img;
}

/* ───────── Comunicación con Apps Script ───────── */
async function fetchJson(url, opts, timeout) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout || 30000);
  try {
    const r = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); }
    catch (e) {
      throw new ApiError('SERVER', 'El servidor respondió algo inesperado. Revisa que la implementación de Apps Script permita acceso a “Cualquier persona”.');
    }
    if (!j.ok) throw new ApiError(j.code || 'SERVER', j.message || 'Error del servidor.');
    return j;
  } catch (e) {
    if (e instanceof ApiError) throw e;
    if (e && e.name === 'AbortError') throw new ApiError('NETWORK', 'La conexión tardó demasiado. Inténtalo de nuevo.');
    throw new ApiError('NETWORK', 'No hay conexión con el servidor.');
  } finally {
    clearTimeout(timer);
  }
}

const inflight = new Map();
function apiGet(params) {
  const q = new URLSearchParams(params).toString();
  if (inflight.has(q)) return inflight.get(q);
  const p = fetchJson(CONFIG.API_URL + '?' + q).finally(() => inflight.delete(q));
  inflight.set(q, p);
  return p;
}

function postRaw(body, token, timeout) {
  return fetchJson(
    CONFIG.API_URL,
    { method: 'POST', body: JSON.stringify(Object.assign({}, body, { idToken: token })) },
    timeout || 45000
  );
}

async function post(body, timeout) {
  if (!state.admin) throw new ApiError('AUTH', 'Inicia sesión como administrador.');
  if (state.admin.exp * 1000 < Date.now() + 15000) {
    logout();
    throw new ApiError('AUTH', 'Tu sesión venció. Vuelve a entrar.');
  }
  try {
    return await postRaw(body, state.admin.token, timeout);
  } catch (e) {
    if (e.code === 'AUTH') logout();
    throw e;
  }
}

/* Muestra lo guardado al instante y actualiza en segundo plano si algo cambió. */
function swr(key, fetcher, onData, onUnchanged) {
  const ck = 'pf:' + key;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(ck)); } catch (e) { cached = null; }
  if (cached) onData(cached, false);
  return fetcher().then(
    fresh => {
      const s = JSON.stringify(fresh);
      if (!cached || JSON.stringify(cached) !== s) {
        try { localStorage.setItem(ck, s); } catch (e) { /* almacenamiento lleno: se ignora */ }
        onData(fresh, true);
      } else if (onUnchanged) {
        onUnchanged();
      }
    },
    err => { if (!cached) throw err; }
  );
}

function invalidate(keys) {
  keys.forEach(k => { try { localStorage.removeItem('pf:' + k); } catch (e) { /* nada */ } });
}

/* ───────── Contacto y "Sobre mí" ───────── */
function instagram() {
  const v = String(CONFIG.INSTAGRAM || '').trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) {
    const h = v.replace(/[?#].*$/, '').replace(/\/+$/, '').split('/').pop().replace(/^@/, '');
    return { href: v, text: h ? '@' + h : 'Instagram' };
  }
  const h = v.replace(/^@/, '');
  return { href: 'https://instagram.com/' + h, text: '@' + h };
}

function contactItems() {
  const items = [];
  if (CONFIG.CONTACT_EMAIL) items.push({ label: 'Correo', text: CONFIG.CONTACT_EMAIL, href: 'mailto:' + CONFIG.CONTACT_EMAIL });
  const ig = instagram();
  if (ig) items.push({ label: 'Instagram', text: ig.text, href: ig.href, ext: true });
  const wa = String(CONFIG.WHATSAPP || '').replace(/\D/g, '');
  if (wa) items.push({ label: 'WhatsApp', text: '+' + wa, href: 'https://wa.me/' + wa, ext: true });
  if (CONFIG.LOCATION) items.push({ label: 'Ubicación', text: CONFIG.LOCATION });

const aboutParagraphs = () => String(CONFIG.ABOUT || '').split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
/* La foto subida desde la página (Admin → Foto de perfil) manda sobre ABOUT_PHOTO de config.js. */
const photoRef = () => state.profile || String(CONFIG.ABOUT_PHOTO || '').trim();
const hasAbout = () => aboutParagraphs().length > 0 || !!photoRef();

function aboutLabel() {
  if (hasAbout()) return 'Sobre mí';

}

/* Saca el ID de Drive de un enlace de compartir (…/file/d/ID/view…), de una dirección con ?id=ID,
   o de un ID suelto (con o sin "?usp=sharing" al final). Devuelve null si es un archivo normal. */
function driveIdFrom(value) {
  const v = String(value || '').trim();
  let m = v.match(/(?:drive|docs)\.google\.com\/.*?(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
  if (m) return m[1];
  m = v.match(/^([A-Za-z0-9_-]{20,})(?:[?#].*)?$/);
  return m ? m[1] : null;
}

/* Foto circular. ABOUT_PHOTO puede ser un archivo del repositorio ('fotoperfil.jpg'),
   una dirección completa (https://…) o un enlace / ID de un archivo de Drive. */
function avatar(size, onFail) {
  const v = photoRef();
  if (!v) return null;
  const id = state.profile ? state.profile : driveIdFrom(v); // el ID que entrega el servidor siempre es de Drive
  const wrap = el('div', { class: 'avatar' + (size ? ' ' + size : '') });
  const im = document.createElement('img');
  im.alt = 'Retrato de ' + CONFIG.SITE_NAME;
  im.decoding = 'async';
  im.style.objectPosition = CONFIG.ABOUT_PHOTO_POSITION || 'center 25%';
  let tried = false;
  im.addEventListener('load', () => im.classList.add('ok'));
  im.addEventListener('error', () => {
    if (id && !tried) { tried = true; im.src = imgFallback(id, 900); return; }
    wrap.remove();
    if (onFail) onFail();
    const hint = id
      ? 'No se pudo cargar tu foto de perfil. En Drive, compártela como “Cualquier persona con el enlace” (o muévela a la carpeta Portafolio).'
      : 'No se pudo cargar tu foto de perfil. Revisa que el archivo “' + v + '” esté subido junto a index.html y que el nombre coincida.';
    console.warn(hint);
    if (state.admin) toast(hint, 'error');
  });
  im.src = id ? imgSrc(id, 900) : v;
  wrap.append(im);
  return wrap;
}

/* ───────── Imágenes del sitio: fondo, logo y firma ───────── */
/* Salen de archivos llamados fondo, logo y firma en la carpeta Portafolio de Drive
   (los detecta el script) o, si prefieres, de config.js (enlace de Drive o archivo de GitHub). */
const ASSET_CONFIG = { fondo: 'BACKGROUND_IMAGE', logo: 'LOGO_IMAGE', firma: 'SIGNATURE_IMAGE' };

function assetUrl(slot, w) {
  const id = state.assets[slot] || driveIdFrom(CONFIG[ASSET_CONFIG[slot]]);
  if (id) {
    return w
      ? { src: imgSrc(id, w), fb: imgFallback(id, w) }
      : { src: 'https://lh3.googleusercontent.com/d/' + id, fb: 'https://drive.google.com/uc?export=view&id=' + id };
  }
  const ref = String(CONFIG[ASSET_CONFIG[slot]] || '').trim();
  return ref ? { src: ref, fb: null } : null;
}

/* Prepara un logo o una firma:
   · recorta los márgenes vacíos, para que el dibujo se vea más grande;
   · si es a color, conserva sus colores;
   · si tiene fondo (blanco, oscuro o con textura), lo vuelve transparente;
   · si es de tinta oscura y de un solo color, la vuelve blanca para que se vea sobre fondos oscuros.
   Devuelve null si no hay nada que cambiar. */
function prepareInk(im, mode) {
  const force = mode === 'blanco';
  const k = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0, w, h);
  const data = x.getImageData(0, 0, w, h);   // lanza un error si la imagen no permite leer sus píxeles
  const a = data.data;
  const luma = i => (0.2126 * a[i] + 0.7152 * a[i + 1] + 0.0722 * a[i + 2]) / 255;

  let minA = 255;
  for (let i = 3; i < a.length; i += 4) if (a[i] < minA) minA = a[i];
  const opaque = minA >= 250;

  // Imagen opaca: el fondo de cada fila se estima con sus bordes (sirve para degradados y texturas)
  const rowBg = opaque ? new Array(h) : null;
  if (opaque) {
    const e = Math.max(1, Math.min(4, Math.floor(w / 10)));
    for (let y = 0; y < h; y++) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let dx = 0; dx < e; dx++) {
        for (const px of [dx, w - 1 - dx]) { const i = (y * w + px) * 4; r += a[i]; g += a[i + 1]; b += a[i + 2]; n++; }
      }
      rowBg[y] = [r / n, g / n, b / n];
    }
  }
  const diffAt = (i, y) => {
    const bg = rowBg[y];
    return Math.max(Math.abs(a[i] - bg[0]), Math.abs(a[i + 1] - bg[1]), Math.abs(a[i + 2] - bg[2]));
  };

  // Dónde está el dibujo, cuánto color tiene y qué tan claro u oscuro es
  const rows = new Uint32Array(h), cols = new Uint32Array(w);
  let chromaSum = 0, lumaSum = 0, cn = 0;
  for (let y = 0; y < h; y++) {
    for (let px = 0; px < w; px++) {
      const i = (y * w + px) * 4;
      const inside = opaque ? diffAt(i, y) > 40 : a[i + 3] > 24;
      if (!inside) continue;
      rows[y]++; cols[px]++;
      chromaSum += (Math.max(a[i], a[i + 1], a[i + 2]) - Math.min(a[i], a[i + 1], a[i + 2])) / 255;
      lumaSum += luma(i);
      cn++;
    }
  }
  if (!cn) return null;
  const first = arr => arr.findIndex(v => v >= 2);
  const last = arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] >= 2) return i; return -1; };
  let x0 = first(cols), x1 = last(cols), y0 = first(rows), y1 = last(rows);
  if (x0 < 0 || y0 < 0) return null;
  const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.04) + 1;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const trim = cw * ch < w * h * 0.94;
  const colorful = chromaSum / cn > 0.22;
  const meanL = lumaSum / cn;

  let changed = false;
  if (!opaque) {
    if (force || (!colorful && meanL < 0.55)) {           // tinta oscura de un solo color → blanca
      for (let i = 0; i < a.length; i += 4) { a[i] = a[i + 1] = a[i + 2] = 255; }
      changed = true;
    }
  } else {
    let bgL = 0;
    for (let y = 0; y < h; y++) bgL += (0.2126 * rowBg[y][0] + 0.7152 * rowBg[y][1] + 0.0722 * rowBg[y][2]) / 255;
    bgL /= h;
    const mono = !colorful || force;
    if (mono && bgL > 0.5) {                               // tinta oscura sobre fondo claro → tinta blanca
      for (let y = 0; y < h; y++) {
        for (let px = 0; px < w; px++) {
          const i = (y * w + px) * 4;
          const l = luma(i);                                   // se lee ANTES de pintar de blanco
          a[i] = a[i + 1] = a[i + 2] = 255;
          a[i + 3] = Math.round(Math.max(0, Math.min(1, ((bgL - l) / bgL) * 1.8)) * 255);
        }
      }
    } else {                                               // a color, o tinta clara: solo se quita el fondo
      for (let y = 0; y < h; y++) {
        for (let px = 0; px < w; px++) {
          const i = (y * w + px) * 4;
          a[i + 3] = Math.round(Math.max(0, Math.min(1, (diffAt(i, y) - 18) / 42)) * 255);
        }
      }
    }
    changed = true;
  }
  if (!changed && !trim) return null;

  x.putImageData(data, 0, 0);
  if (!trim) return c.toDataURL('image/png');
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
  return out.toDataURL('image/png');
}

const inkCache = new Map();
/* Carga logo o firma. Intenta con permiso CORS (para poder analizar los colores); si no se puede, la muestra tal cual. */
function loadInk(slot, mode) {
  const u = assetUrl(slot, 0);
  if (!u) return Promise.reject(new Error('sin imagen'));
  const key = u.src + '|' + mode;
  if (inkCache.has(key)) return inkCache.get(key);
  const p = new Promise((resolve, reject) => {
    const tryLoad = (url, cors, next) => {
      const im = new Image();
      if (cors) im.crossOrigin = 'anonymous';
      im.onload = () => resolve({ im, cors, url });
      im.onerror = next;
      im.src = url;
    };
    const fail = () => reject(new Error('no se pudo cargar'));
    tryLoad(u.src, true, () => tryLoad(u.src, false, () => (u.fb ? tryLoad(u.fb, false, fail) : fail())));
  }).then(({ im, cors, url }) => {
    if (mode === 'original' || !cors) return url;
    try { return prepareInk(im, mode) || url; } catch (e) { return url; }
  });
  inkCache.set(key, p);
  p.catch(() => inkCache.delete(key));
  return p;
}

/* Ajusta la imagen a la pantalla sin recortarla y funde sus bordes con el relleno desenfocado. */
function layoutBg() {
  const bg = $('#bg'), img = $('.bg-img', bg);
  const ar = bg._ar;
  if (!ar || bg.classList.contains('cover')) {
    img.classList.remove('feather');
    ['left', 'top', 'right', 'bottom', 'width', 'height', 'backgroundSize'].forEach(k => { img.style[k] = ''; });
    return;
  }
  const cw = bg.clientWidth, ch = bg.clientHeight;
  const w = Math.round(Math.min(cw, ch * ar)), h = Math.round(w / ar);
  Object.assign(img.style, {
    left: Math.round((cw - w) / 2) + 'px', top: Math.round((ch - h) / 2) + 'px', right: 'auto', bottom: 'auto',
    width: w + 'px', height: h + 'px', backgroundSize: '100% 100%',
  });
  img.classList.add('feather');
}

function applyBackground() {
  const bg = $('#bg');
  const u = assetUrl('fondo', heroSize());
  const key = u ? u.src : '';
  if (bg.dataset.src === key) return;
  bg.dataset.src = key;
  bg.classList.remove('on');
  document.body.classList.remove('has-bg');
  if (!u) return;
  const im = new Image();
  let fb = false;
  im.onload = () => {
    if (bg.dataset.src !== key) return;
    const css = 'url("' + im.src + '")';
    $('.bg-fill', bg).style.backgroundImage = css;
    $('.bg-img', bg).style.backgroundImage = css;
    const scale = Number(CONFIG.BACKGROUND_SCALE);
    bg.style.setProperty('--bgs', String(isFinite(scale) && scale > 0 ? Math.min(1.5, Math.max(0.3, scale)) : 1));
    bg.classList.toggle('cover', String(CONFIG.BACKGROUND_SIZE).toLowerCase() === 'cover');
    bg.classList.toggle('move', !reduceMotion && String(CONFIG.BACKGROUND_EFFECT).toLowerCase() !== 'ninguno');
    bg._ar = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0;
    layoutBg();
    bg.classList.add('on');
    document.body.classList.add('has-bg');
    onScroll();
  };
  im.onerror = () => { if (!fb && u.fb) { fb = true; im.src = u.fb; } };
  im.src = u.src;
}

function applyLogo() {
  const brand = $('#brand');
  const u = assetUrl('logo', 0);
  const key = u ? u.src : '';
  if (brand.dataset.logo === key) return;
  brand.dataset.logo = key;
  brand.classList.remove('has-logo');
  document.body.classList.remove('has-logo');

    document.body.classList.add('has-logo');

}

function applyAssets() {
  applyBackground();
  applyLogo();
}
/* ───────── Efectos: revelado al desplazarse y portada ───────── */
let revealIO = null;
/* Los elementos con data-rv aparecen suavemente al entrar en pantalla (una vez por página). */
function reveal(scope, root) {
  if (reduceMotion || !('IntersectionObserver' in window)) return;
  const k = state.routeKey + '|' + scope;
  if (state.revealed.has(k)) return;
  state.revealed.add(k);
  if (!revealIO) {
    revealIO = new IntersectionObserver(entries => {
      let i = 0;
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.style.setProperty('--d', Math.min(i++, 6) * 70 + 'ms');
        e.target.classList.add('in');
        revealIO.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });
  }
  root.querySelectorAll('[data-rv]').forEach(n => { n.classList.add('rv'); revealIO.observe(n); });
}

const SLIDE_MS = 6500;
const hs = { el: null, timer: null, i: 0, slides: [], dots: [], cap: null, items: [], visible: true, io: null };

function heroSize() {
  const px = window.innerWidth * Math.min(window.devicePixelRatio || 1, 2);
  return Math.min(maxView(), Math.max(1200, Math.ceil(px / 200) * 200));
}

function heroGo(i, byUser) {
  const n = hs.slides.length;
  if (!n) return;
  const prev = hs.slides[hs.i];
  hs.i = ((i % n) + n) % n;
  const cur = hs.slides[hs.i];
  if (prev && prev !== cur) {
    prev.classList.remove('on');
    clearTimeout(prev._t);
    prev._t = setTimeout(() => prev.classList.remove('kb'), 1500); // el zoom sigue mientras se desvanece
  }
  const img = cur._load();
  const activate = () => {
    if (hs.slides[hs.i] !== cur) return; // el usuario ya cambió de imagen
    clearTimeout(cur._t);
    cur.classList.remove('kb');
    void cur.offsetWidth;
    cur.classList.add('on');
    if (!reduceMotion) cur.classList.add('kb');
  };
  if (img.complete && img.naturalWidth) activate(); else img.addEventListener('load', activate, { once: true });
  hs.slides[(hs.i + 1) % n]._load(); // precarga la siguiente
  hs.dots.forEach((d, k) => d.setAttribute('aria-current', String(k === hs.i)));
  const c = hs.items[hs.i];
  hs.cap.textContent = c.title;
  hs.cap.href = '#/c/' + c.id;
  if (byUser) heroRestart();
}

function heroRestart() {
  clearInterval(hs.timer);
  hs.timer = null;
  if (reduceMotion || hs.slides.length < 2) return;
  hs.timer = setInterval(() => {
    if (document.hidden || !hs.visible) return; // no gasta batería si no se ve
    heroGo(hs.i + 1, false);
  }, SLIDE_MS);
}

function stopHero() {
  clearInterval(hs.timer);
  hs.timer = null;
  if (hs.io) { hs.io.disconnect(); hs.io = null; }
  hs.el = null; hs.slides = []; hs.dots = []; hs.items = [];
  document.body.classList.remove('hero-on');
  $('.top').classList.remove('solid');
}

/* El texto de la portada: si trae un guion largo ("—"), la primera parte se ve en
   una serif fina en mayúsculas y el resto en una caligrafía elegante, como una firma. */
function heroTitle() {
  const t = String(CONFIG.TAGLINE || CONFIG.SITE_NAME || '').trim();
  const parts = t.split(/\s*[—–]\s*/);
  if (parts.length > 1 && parts[0] && parts.slice(1).join('').trim()) {
    return el('h1', {},
      el('span', { class: 'hero-kicker', text: parts[0] }),
      el('span', { class: 'hero-script', text: parts.slice(1).join(' — ') }));
  }
  return el('h1', { class: 'hero-script', text: t });
}

function buildHero() {
  const items = state.tree.filter(c => c.cover).slice(0, 6);
  if (!items.length) return null;
  const w = heroSize();
  hs.items = items;
  hs.i = 0;
  hs.slides = items.map((c, i) => {
    const img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    if (i === 0) img.setAttribute('fetchpriority', 'high');
    let fb = false;
    img.addEventListener('error', () => { if (!fb) { fb = true; img.src = imgFallback(c.cover, w); } });
    const slide = el('div', { class: 'slide' }, img);
    slide.style.setProperty('--kx', i % 2 ? '-1.5%' : '1.5%');
    slide._load = () => { if (!img.getAttribute('src')) img.src = imgSrc(c.cover, w); return img; };
    return slide;
  });
  hs.dots = items.map((c, i) => el('button', { class: 'dot', type: 'button', 'aria-label': 'Ver ' + c.title, onclick: () => heroGo(i, true) }));
  hs.cap = el('a', { class: 'hero-cap' });
  const label = aboutLabel();
  const mid = el('div', { class: 'hero-mid' });
  const goWork = () => {
    const t = document.getElementById('work');
    if (t) t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  };
  const actions = el('div', { class: 'hero-actions' },
    el('button', { class: 'btn light', type: 'button', onclick: goWork }, 'Ver trabajo'),
    label ? el('a', { class: 'btn ghost', href: '#/sobre-mi', text: label }) : null);
  const meta = el('div', { class: 'hero-meta' }, hs.cap, el('div', { class: 'dots' }, hs.dots));
  const hero = el('section', { class: 'hero', 'aria-label': 'Presentación' },
    el('div', { class: 'hero-media', 'aria-hidden': 'true' }, hs.slides),
    el('div', { class: 'hero-in' },
      mid,
      heroTitle(),
      el('div', { class: 'hero-foot' }, actions, meta)));
  hs.el = hero;
  heroGo(0, false);
  if (assetUrl('firma', 0)) {
    loadInk('firma', CONFIG.SIGNATURE_MODE || 'auto').then(src => {
      if (hs.el !== hero) return; // la portada ya se reemplazó
      mid.append(el('img', { class: 'hero-sign', src, alt: 'Firma de ' + CONFIG.SITE_NAME, decoding: 'async' }));
    }).catch(() => { /* sin firma, la portada queda igual */ });
  }
  return hero;
}

function startHero() {
  document.body.classList.add('hero-on');
  heroRestart();
  if ('IntersectionObserver' in window) {
    hs.io = new IntersectionObserver(([e]) => { hs.visible = e.isIntersecting; }, { threshold: 0.1 });
    hs.io.observe(hs.el);
  }
  onScroll();
}

let scrollTick = false;
function onScroll() {
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    const bgEl = $('#bg');
    if (bgEl.classList.contains('move')) bgEl.style.setProperty('--bgy', (-Math.min(window.scrollY, 3000) * 0.05).toFixed(1) + 'px');
    const top = $('.top');
    if (!hs.el) { top.classList.remove('solid'); return; }
    const h = hs.el.offsetHeight || 1;
    const y = window.scrollY;
    if (!reduceMotion) hs.el.style.setProperty('--p', Math.min(1, Math.max(0, y / h)).toFixed(3));
    top.classList.toggle('solid', y > h - 72);
  });
}

/* ───────── Rutas ───────── */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const key = parts.join('/');
  const token = ++state.token;
  const changed = key !== state.routeKey;
  if (changed) {
    window.scrollTo(0, 0);
    state.revealed.clear();
    if (revealIO) revealIO.disconnect();
    if (!reduceMotion) { main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter'); }
  }
  state.routeKey = key;
  stopHero();

  let view;
  if (parts[0] === 'c' && parts[1]) view = { type: parts[2] ? 'album' : 'cat', catId: parts[1], albumId: parts[2] };
  else if (parts[0] === 'sobre-mi') view = { type: 'about' };
  else view = { type: 'home' };
  state.view = view;
  closeMenu();
  updateNav();
  updateAdminBar();

  if (!CONFIG.API_URL) {
    if (view.type === 'about') renderAbout(); else renderSetup();
    return;
  }
  if (view.type === 'about') renderAbout(); else showSkeleton(view);
  const guard = () => token === state.token;

  swr('tree', () => apiGet({ action: 'tree' }), (data, fresh) => {
    if (!guard()) return;
    state.tree = data.categories || [];
    state.profile = data.profile || null;
    state.assets = data.assets || {};
    applyAssets();
    renderNav();
    renderFooterWork();
    if (view.type !== 'about') renderView(view, fresh, token);
  }, () => {
    // El servidor confirmó que no hay cambios: si el enlace no existe, avisamos.
    if (guard() && view.type !== 'about' && !resolveView(view)) renderNotFound();
  }).catch(err => { if (guard() && view.type !== 'about') renderError(err); });
}

function resolveView(view) {
  if (view.type === 'home') return {};
  const cat = state.tree.find(c => c.id === view.catId);
  if (!cat) return null;
  if (view.type === 'cat') return { cat };
  const album = cat.albums.find(a => a.id === view.albumId);
  return album ? { cat, album } : null;
}

function renderView(view, fresh, token) {
  const r = resolveView(view);
  if (!r) {
    if (fresh) renderNotFound();
    return;
  }
  if (view.type === 'home') renderHome();
  else if (view.type === 'cat') renderCategory(view, r.cat, token);
  else renderAlbum(view, r.cat, r.album, token);
}

function showSkeleton(view) {
  const w = el('div', { class: 'page', 'aria-busy': 'true' });
  w.append(el('div', { class: 'sk ' + (view.type === 'home' ? 'sk-lead' : 'sk-title') }));
  const g = el('div', { class: 'cards' });
  for (let i = 0; i < (view.type === 'home' ? 4 : 8); i++) g.append(el('div', { class: 'sk sk-card' }));
  w.append(g);
  main.replaceChildren(w);
}

function emptyState(title, text, action) {
  return el('div', { class: 'empty' },
    el('h2', { text: title }),
    text ? el('p', { text }) : null,
    action || null);
}

function showPage(...kids) {
  main.replaceChildren(el('div', { class: 'page' }, ...kids));
}

function renderSetup() {
  document.title = CONFIG.SITE_NAME;
  showPage(emptyState(
    'Falta conectar con Drive',
    'Abre el archivo config.js y pega en API_URL la dirección de tu aplicación de Apps Script.'
  ));
}

function renderError(err) {
  showPage(emptyState(
    'No se pudo cargar',
    (err && err.message) || 'Ocurrió un error inesperado.',
    el('button', { class: 'btn light', type: 'button', onclick: () => route() }, 'Reintentar')
  ));
}

function renderNotFound() {
  document.title = CONFIG.SITE_NAME;
  showPage(emptyState(
    'No encontramos esa página',
    'Puede que la carpeta se haya cambiado de nombre o eliminado.',
    el('a', { class: 'btn light', href: '#/' }, 'Volver al inicio')
  ));
}

/* ───────── Vistas ───────── */
function crumbs(items) {
  const nav = el('nav', { class: 'crumbs', 'aria-label': 'Ruta' });
  items.forEach((it, i) => {
    if (i) nav.append(el('span', { class: 'sep', 'aria-hidden': 'true' }, '/'));
    nav.append(it.href ? el('a', { href: it.href, text: it.text }) : el('span', { 'aria-current': 'page', text: it.text }));
  });
  return nav;
}

function pageHead(items, title) {
  return el('header', { class: 'page-head' }, crumbs(items), el('h1', { class: 'title', text: title }));
}

function card(href, coverId, name, first) {
  const ph = el('div', { class: 'ph' });
  if (coverId) {
    ph.append(makeImg(coverId, 700, '', {
      lazy: !first,
      onload: im => { if (im.naturalWidth && im.naturalHeight) ph.style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; },
    }));
  }
  return el('a', { class: 'card', href, 'data-rv': true }, ph, el('span', { class: 'nm', text: name }));
}

function renderHome() {
  document.title = CONFIG.SITE_NAME + ' — Fotografía';
  stopHero();
  const hero = buildHero();
  const wrap = el('div', { class: 'page' });
  if (!hero) {
    wrap.append(CONFIG.TAGLINE
      ? el('section', { class: 'intro' }, el('h1', { class: 'lead', text: CONFIG.TAGLINE }))
      : el('h1', { class: 'sr', text: CONFIG.SITE_NAME }));
  }
  const work = el('section', { id: 'work', 'aria-labelledby': 'workTitle', class: hero ? 'after-hero' : null },
    el('div', { class: 'sec-head', 'data-rv': true }, el('h2', { id: 'workTitle', text: 'Trabajo' })));
  if (!state.tree.length) {
    work.append(emptyState(
      'Aún no hay fotografías',
      state.admin ? 'Crea la primera categoría con el botón de abajo.' : 'Vuelve pronto.'
    ));
  } else {
    const grid = el('div', { class: 'cards' });
    state.tree.forEach((c, i) => grid.append(card('#/c/' + c.id, c.cover, c.title, i < 4)));
    work.append(grid);
  }
  wrap.append(work);
  if (hasAbout()) wrap.append(homeAbout());
  main.replaceChildren(...(hero ? [hero] : []), wrap);
  if (hero) startHero();
  updateAdminBar();
  reveal('home', wrap);
}

function renderCategory(view, cat, token) {
  document.title = `${cat.title} — ${CONFIG.SITE_NAME}`;
  view.folderId = cat.id;
  view.label = cat.title;
  const wrap = el('div', { class: 'page' },
    pageHead([{ href: '#/', text: 'Inicio' }, { text: cat.title }], cat.title));
  if (cat.albums.length) {
    const grid = el('div', { class: 'cards' });
    cat.albums.forEach((a, i) => grid.append(card(`#/c/${cat.id}/${a.id}`, a.cover, a.title, i < 4)));
    wrap.append(grid);
  }
  const host = el('section', { class: 'wall-host' });
  wrap.append(host);
  main.replaceChildren(wrap);
  updateAdminBar();
  reveal('cat', wrap);
  loadWall(cat.id, host, cat.title, token, {
    heading: cat.albums.length ? 'Más fotos' : null,
    empty: cat.albums.length ? null : (state.admin ? 'Sube fotos o crea una carpeta con los botones de abajo.' : 'Esta categoría todavía no tiene fotos.'),
  });
}

function renderAlbum(view, cat, album, token) {
  document.title = `${album.title} — ${cat.title} — ${CONFIG.SITE_NAME}`;
  view.folderId = album.id;
  view.label = `${cat.title} / ${album.title}`;
  const wrap = el('div', { class: 'page' },
    pageHead([{ href: '#/', text: 'Inicio' }, { href: '#/c/' + cat.id, text: cat.title }, { text: album.title }], album.title));
  const host = el('section', { class: 'wall-host' });
  wrap.append(host);

  const idx = cat.albums.findIndex(a => a.id === album.id);
  const next = cat.albums[idx + 1];
  wrap.append(el('nav', { class: 'pager', 'aria-label': 'Más carpetas' },
    el('a', { href: '#/c/' + cat.id }, el('span', { class: 'lbl', text: 'Volver a' }), cat.title),
    next ? el('a', { class: 'next', href: `#/c/${cat.id}/${next.id}` }, el('span', { class: 'lbl', text: 'Siguiente' }), next.title) : null));

  main.replaceChildren(wrap);
  updateAdminBar();
  loadWall(album.id, host, album.title, token, {
    count: true,
    empty: state.admin ? 'Sube las primeras fotos con el botón de abajo.' : 'Esta carpeta todavía no tiene fotos.',
  });
}

function renderAbout() {
  const label = aboutLabel();
  document.title = `${label || 'Sobre mí'} — ${CONFIG.SITE_NAME}`;
  if (!label) {
    showPage(emptyState('Próximamente', 'Esta sección todavía no tiene contenido.',
      el('a', { class: 'btn light', href: '#/' }, 'Volver al inicio')));
    return;
  }
  const grid = el('div', { class: 'about' + (photoRef() ? '' : ' solo') });
  const av = avatar('lg', () => grid.classList.add('solo'));
  if (av) grid.append(av);
  const tx = el('div', { class: 'about-tx' }, el('p', { class: 'who', text: CONFIG.SITE_NAME }));
  aboutParagraphs().forEach(p => tx.append(el('p', { text: p })));
  const items = contactItems();
  if (items.length) {
    const dl = el('dl', { class: 'facts' });
    items.forEach(it => dl.append(el('dt', { text: it.label }), el('dd', {}, it.href ? linkFor(it) : it.text)));
    tx.append(dl);
  }
  grid.append(tx);
  showPage(pageHead([{ href: '#/', text: 'Inicio' }, { text: label }], label), grid);
}

function loadWall(folderId, host, title, token, opts) {
  swr('photos:' + folderId, () => apiGet({ action: 'photos', folder: folderId }), data => {
    if (token !== state.token) return;
    renderWall(host, data.photos || [], folderId, title, opts);
  }).catch(err => {
    if (token !== state.token) return;
    host.replaceChildren(emptyState('No se pudieron cargar las fotos', err.message,
      el('button', { class: 'btn light', type: 'button', onclick: () => route() }, 'Reintentar')));
  });
}

function renderWall(host, ids, folderId, title, opts) {
  host.replaceChildren();
  if (!ids.length) {
    if (opts.empty) host.append(emptyState(state.admin ? 'Vacío por ahora' : 'Sin fotos', opts.empty));
    return;
  }
  if (opts.heading) host.append(el('div', { class: 'sec-head subhead', 'data-rv': true }, el('h2', { text: opts.heading })));
  if (opts.count) host.append(el('p', { class: 'count', text: ids.length === 1 ? '1 foto' : `${ids.length} fotos` }));
  const wall = el('div', { class: 'wall' });
  ids.forEach((id, i) => {
    const open = el('button', {
      class: 'open', type: 'button',
      'aria-label': `Ver foto ${i + 1} de ${ids.length}`,
      onclick: () => openLightbox(ids, i, title),
    });
    open.append(makeImg(id, 700, `${title}, foto ${i + 1}`, {
      onload: im => { if (im.naturalWidth && im.naturalHeight) open.style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; },
    }));
    const tile = el('div', { class: 'tile', 'data-rv': true }, open);
    if (state.admin) {
      tile.append(el('button', {
        class: 'del', type: 'button', 'aria-label': 'Eliminar esta foto',
        onclick: () => deletePhoto(id, folderId),
      }, '×'));
    }
    wall.append(tile);
  });
  host.append(wall);
  reveal('wall:' + folderId, wall);
}

/* ───────── Visor ───────── */
const lb = {
  el: $('#lightbox'), img: $('#lbImg'), ids: [], i: 0, title: '',
  open: false, pushed: false, closing: false, opener: null, seq: 0,
};

function maxView() { return Math.max(600, Number(CONFIG.MAX_VIEW_PX) || 2000); }

function lbSize() {
  const px = Math.max(window.innerWidth, window.innerHeight) * Math.min(window.devicePixelRatio || 1, 2);
  return Math.min(maxView(), Math.max(800, Math.ceil(px / 200) * 200));
}

function openLightbox(ids, index, title) {
  lb.ids = ids; lb.title = title; lb.opener = document.activeElement;
  lb.open = true; lb.closing = false;
  lb.el.hidden = false;
  document.body.classList.add('lb-open');
  $('#lbTitle').textContent = title;
  history.pushState({ lb: 1 }, '');
  lb.pushed = true;
  showPhoto(index);
  $('#lbClose').focus();
}

function showPhoto(i) {
  const n = lb.ids.length;
  lb.i = ((i % n) + n) % n;
  const id = lb.ids[lb.i];
  const w = lbSize();
  const seq = ++lb.seq;
  lb.el.classList.add('loading');
  lb.img.classList.remove('ok');
  lb.img.setAttribute('aria-label', `${lb.title}, foto ${lb.i + 1} de ${n}`);
  $('#lbCount').textContent = `${lb.i + 1} / ${n}`;
  const loader = new Image();
  let triedFallback = false;
  loader.onload = () => {
    if (seq !== lb.seq) return;
    paintLightbox(loader);
    lb.img.classList.add('ok');
    lb.el.classList.remove('loading');
  };
  loader.onerror = () => {
    if (seq !== lb.seq) return;
    if (!triedFallback) { triedFallback = true; loader.src = imgFallback(id, w); return; }
    lb.el.classList.remove('loading');
    toast('No se pudo cargar esta foto.', 'error');
  };
  loader.src = imgSrc(id, w);
  if (n > 1) {
    [1, -1].forEach(d => { new Image().src = imgSrc(lb.ids[(lb.i + d + n) % n], w); });
  }
}

function closeLightbox() {
  if (!lb.open || lb.closing) return;
  lb.closing = true;
  if (lb.pushed) history.back(); else finishClose();
}

function finishClose() {
  lb.el.hidden = true;
  lb.open = false; lb.pushed = false; lb.closing = false; lb.seq++;
  lb.img.width = 1; lb.img.height = 1;   // libera la memoria de la foto
  lb.img.classList.remove('ok');
  document.body.classList.remove('lb-open');
  if (lb.opener && document.contains(lb.opener)) lb.opener.focus();
}

window.addEventListener('popstate', () => {
  if (lb.open) { lb.pushed = false; finishClose(); }
});

document.addEventListener('keydown', e => {
  if (!lb.open) {
    if (e.key === 'Escape' && $('#nav').classList.contains('is-open')) closeMenu();
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
  else if (e.key === 'ArrowRight') showPhoto(lb.i + 1);
  else if (e.key === 'ArrowLeft') showPhoto(lb.i - 1);
  else if (e.key === 'Tab') {
    const f = ['#lbClose', '#lbPrev', '#lbNext'].map(s => $(s));
    const idx = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

$('#lbClose').addEventListener('click', closeLightbox);
$('#lbPrev').addEventListener('click', () => showPhoto(lb.i - 1));
$('#lbNext').addEventListener('click', () => showPhoto(lb.i + 1));
$('#lbStage').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
(function swipe() {
  const stage = $('#lbStage');
  let sx = 0, sy = 0;
  stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showPhoto(lb.i + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();

/* ───────── Protección de las fotos ───────── */
/* Ninguna página web puede impedir por completo una captura de pantalla. Esto dificulta mucho la
   descarga casual (clic derecho, mantener pulsado, arrastrar, guardar la página, imprimir), hace que
   la foto grande se dibuje en un lienzo con marca de agua y limita la resolución que ve el público. */
const FONT = "'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif";

function drawWatermark(x, w, h) {
  const text = CONFIG.WATERMARK_TEXT || ('© ' + CONFIG.SITE_NAME);
  const op = Math.min(0.8, Math.max(0.05, Number(CONFIG.WATERMARK_OPACITY) || 0.22));
  const fs = Math.max(16, Math.round(Math.min(w, h) * 0.04));
  x.save();
  x.font = '600 ' + fs + 'px ' + FONT;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.lineJoin = 'round';
  x.lineWidth = Math.max(1, fs / 12);
  x.translate(w / 2, h / 2);
  x.rotate(-Math.PI / 6);
  const gapX = x.measureText(text).width * 1.9, gapY = fs * 5, reach = Math.hypot(w, h);
  let row = 0;
  for (let y = -reach; y < reach; y += gapY, row++) {
    for (let px = -reach + (row % 2) * gapX / 2; px < reach; px += gapX) {
      x.strokeStyle = 'rgba(0,0,0,' + (op * 0.6) + ')';
      x.strokeText(text, px, y);
      x.fillStyle = 'rgba(255,255,255,' + op + ')';
      x.fillText(text, px, y);
    }
  }
  x.restore();
  // marca principal, más firme, en la esquina inferior derecha
  x.save();
  x.font = '600 ' + Math.round(fs * 1.15) + 'px ' + FONT;
  x.textAlign = 'right';
  x.textBaseline = 'bottom';
  x.lineJoin = 'round';
  x.lineWidth = Math.max(2, fs / 8);
  x.strokeStyle = 'rgba(0,0,0,0.45)';
  x.strokeText(text, w - fs, h - fs * 0.8);
  x.fillStyle = 'rgba(255,255,255,0.7)';
  x.fillText(text, w - fs, h - fs * 0.8);
  x.restore();
}

function paintLightbox(im) {
  const cv = lb.img;
  const k = Math.min(1, maxView() / Math.max(im.naturalWidth, im.naturalHeight));
  cv.width = Math.max(1, Math.round(im.naturalWidth * k));
  cv.height = Math.max(1, Math.round(im.naturalHeight * k));
  const x = cv.getContext('2d');
  x.drawImage(im, 0, 0, cv.width, cv.height);
  if (CONFIG.WATERMARK !== false) drawWatermark(x, cv.width, cv.height);
}

function initProtection() {
  if (CONFIG.PROTECT === false) return;
  document.documentElement.classList.add('protect');
  const MEDIA = '.tile,.card,.open,.hero,#lightbox,.avatar,.brand-logo,.hero-sign,#bg,img,canvas';
  const isMedia = t => !!(t && t.closest && t.closest(MEDIA));
  document.addEventListener('contextmenu', e => { if (isMedia(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { if (isMedia(e.target)) e.preventDefault(); }, true);
  document.addEventListener('keydown', e => {
    const typing = e.target && /^(input|textarea|select)$/i.test(e.target.tagName);
    const k = String(e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && !typing && (k === 's' || k === 'u')) e.preventDefault();  // guardar página / ver código
  }, true);
  document.addEventListener('keyup', e => {
    if (e.key === 'PrintScreen' && navigator.clipboard) navigator.clipboard.writeText('© ' + CONFIG.SITE_NAME).catch(() => {});
  });
  document.documentElement.style.setProperty('--print-msg', JSON.stringify('© ' + CONFIG.SITE_NAME + '. Contenido protegido: no se puede imprimir.'));
}

/* ───────── Contacto rápido (WhatsApp, Instagram, correo) ───────── */
function dockIcon(kind) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const add = (tag, attrs) => { const n = document.createElementNS(ns, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); svg.append(n); };
  if (kind === 'wa') {
