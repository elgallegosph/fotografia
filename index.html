const dock = { el: null, inner: null, items: [], on: false, raf: 0, lastY: 0, vel: 0, prog: 0 };

function initDock() {
  if (CONFIG.DOCK === false) return;
  const wa = String(CONFIG.WHATSAPP || '').replace(/\D/g, '');
  const ig = instagram();
  const list = [];
  if (wa) {
    const msg = CONFIG.WHATSAPP_MESSAGE || ('Hola ' + CONFIG.SITE_NAME + ', vi tu portafolio.');
    list.push({ kind: 'wa', label: 'WhatsApp', aria: 'Escribir por WhatsApp', href: 'https://wa.me/' + wa + '?text=' + encodeURIComponent(msg), ext: true });
  }
  if (ig) list.push({ kind: 'ig', label: 'Instagram', aria: 'Abrir Instagram ' + ig.text, href: ig.href, ext: true });
  if (CONFIG.CONTACT_EMAIL) list.push({ kind: 'ml', label: 'Correo', aria: 'Enviar un correo', href: 'mailto:' + CONFIG.CONTACT_EMAIL });
  if (!list.length) return;

  dock.el = $('#dock');
  dock.inner = el('div', { class: 'dock-in' });
  dock.items = list.map((it, i) => {
    const a = el('a', {
      class: 'dk dk-' + it.kind, href: it.href, 'aria-label': it.aria,
      target: it.ext ? '_blank' : null, rel: it.ext ? 'noopener' : null,
    }, el('span', { class: 'dk-label', text: it.label }), el('span', { class: 'dk-ic' }, dockIcon(it.kind)));
    a.querySelector('.dk-ic').style.setProperty('--i', String(i));
    return { a, pos: 0, rot: 0 };
  });
  dock.inner.append(...dock.items.map(x => x.a));
  dock.el.append(dock.inner);
  dock.el.hidden = false;
  dock.on = true;
  dock.lastY = window.scrollY;
  if (!reduceMotion && window.matchMedia && window.matchMedia('(hover:hover)').matches) {
    dock.el.classList.add('intro');                 // las etiquetas se muestran un momento para llamar la atención
    setTimeout(() => dock.el && dock.el.classList.remove('intro'), 5200);
  }
  window.addEventListener('scroll', dockKick, { passive: true });
  window.addEventListener('resize', dockKick);
  dockTick();
}

function dockKick() { if (dock.on && !dock.raf) dock.raf = requestAnimationFrame(dockTick); }

/* El grupo recorre el borde derecho según avanzas por la página, y cada logo se mueve con un pequeño
   retraso (efecto cadena) cuando el desplazamiento es rápido. Al detenerte, vuelven a su lugar. */
function dockTick() {
  dock.raf = 0;
  const y = window.scrollY;
  const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  const target = Math.min(1, Math.max(0, y / max));
  if (reduceMotion) {
    dock.prog = target;
    dock.inner.style.setProperty('--prog', target.toFixed(4));
    return;
  }
  dock.vel += ((y - dock.lastY) - dock.vel) * 0.3;
  dock.lastY = y;
  dock.prog += (target - dock.prog) * 0.12;
  dock.inner.style.setProperty('--prog', dock.prog.toFixed(4));
  let moving = Math.abs(dock.vel) > 0.05 || Math.abs(target - dock.prog) > 0.0008;
  dock.items.forEach((it, i) => {
    const goal = Math.max(-46, Math.min(46, -dock.vel * (0.9 + i * 0.6)));   // cada logo se retrasa un poco más
    it.pos += (goal - it.pos) * (0.26 - i * 0.05);
    it.rot += (Math.max(-14, Math.min(14, dock.vel * 0.5 * (i % 2 ? -1 : 1))) - it.rot) * 0.2;
    if (Math.abs(it.pos) < 0.04 && Math.abs(goal) < 0.04) it.pos = 0; else moving = true;
    if (Math.abs(it.rot) < 0.04) it.rot = 0; else moving = true;
    it.a.style.setProperty('--dy', it.pos.toFixed(2) + 'px');
    it.a.style.setProperty('--rot', it.rot.toFixed(2) + 'deg');
  });
  if (moving) dock.raf = requestAnimationFrame(dockTick);
}

/* ───────── Administrador: sesión ───────── */
function parseJwt(t) {
  try {
    let p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    p = p.padEnd(Math.ceil(p.length / 4) * 4, '=');
    return JSON.parse(atob(p));
  } catch (e) { return {}; }
}

function restoreAdmin() {
  try {
    const a = JSON.parse(sessionStorage.getItem('pf:admin'));
    if (a && a.token && a.exp * 1000 - Date.now() > 30000) state.admin = a;
    else sessionStorage.removeItem('pf:admin');
  } catch (e) { state.admin = null; }
}

function logout() {
  state.admin = null;
  try { sessionStorage.removeItem('pf:admin'); } catch (e) { /* nada */ }
  updateAdminBar();
  if (CONFIG.API_URL) route();
}

let gsiPromise = null;
function loadGsi() {
  if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
  if (!gsiPromise) {
    gsiPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { gsiPromise = null; reject(new Error('gsi')); };
      document.head.append(s);
    });
  }
  return gsiPromise;
}

let gsiReady = false;
async function openLogin() {
  const dlg = $('#dlgLogin'), msg = $('#loginMsg'), host = $('#gbtn');
  msg.textContent = '';
  host.replaceChildren();
  if (!dlg.open) dlg.showModal();
  if (!CONFIG.GOOGLE_CLIENT_ID) { msg.textContent = 'Falta GOOGLE_CLIENT_ID en config.js.'; return; }
  try { await loadGsi(); }
  catch (e) { msg.textContent = 'No se pudo cargar el inicio de sesión de Google. Desactiva el bloqueador de anuncios e inténtalo de nuevo.'; return; }
  if (!gsiReady) {
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: false });
    gsiReady = true;
  }
  google.accounts.id.renderButton(host, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'es', width: 280 });
}

async function onCredential(resp) {
  const msg = $('#loginMsg');
  msg.textContent = 'Verificando…';
  const token = resp && resp.credential;
  const claims = parseJwt(token || '');
  try {
    await postRaw({ action: 'verify' }, token, 45000);
    state.admin = { email: claims.email || '', exp: claims.exp || 0, token };
    try { sessionStorage.setItem('pf:admin', JSON.stringify(state.admin)); } catch (e) { /* nada */ }
    $('#dlgLogin').close();
    toast('Sesión iniciada.');
    route();
  } catch (e) {
    msg.textContent = e.code === 'FORBIDDEN'
      ? `La cuenta ${claims.email || ''} no es la del administrador.`
      : e.message;
  }
}

/* ───────── Administrador: barra y acciones ───────── */
function syncBarHeight() {
  const bar = $('#adminBar');
  if (bar.hidden) return;
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
}

function updateAdminBar() {
  const bar = $('#adminBar');
  if (!state.admin) {
    bar.hidden = true;
    document.body.classList.remove('has-admin');
    return;
  }
  bar.hidden = false;
  document.body.classList.add('has-admin');
  syncBarHeight();
  $('#adminWho').textContent = 'Modo administrador · ' + state.admin.email;
  const acts = $('#adminActions');
  acts.replaceChildren();
  const b = (text, fn, solid) => el('button', { class: 'btn' + (solid ? ' solid' : ''), type: 'button', onclick: fn }, text);
  const v = state.view || { type: 'home' };
  acts.append(refreshButton());
  if (v.type === 'home') acts.append(b('Foto de perfil', pickProfile), b('Nueva categoría', newCategory, true));
  if (v.type === 'about') acts.append(b('Foto de perfil', pickProfile, true));
  if (v.type === 'cat') acts.append(b('Nueva carpeta', newFolder), b('Subir fotos', openUpload, true));
  if (v.type === 'album') acts.append(b('Subir fotos', openUpload, true));
}

function refreshButton() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', 'M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5');
  svg.append(path);
  return el('button', { class: 'btn ico', type: 'button', 'aria-label': 'Actualizar fotos', title: 'Actualizar fotos', onclick: refreshAll },
    svg, el('span', { class: 'lbl', text: 'Actualizar' }));
}

/* Salta la memoria temporal: muestra al instante lo que se subió directo a Drive. */
async function refreshAll() {
  toast('Actualizando…');
  try {
    await post({ action: 'refresh' }, 90000);
    try {
      Object.keys(localStorage).filter(k => k.startsWith('pf:')).forEach(k => localStorage.removeItem(k));
    } catch (e) { /* nada */ }
    route();
    toast('Actualizado.');
  } catch (e) {
    toast(e.message, 'error');
    if (e.code === 'AUTH') openLogin();
  }
}

function nameDialog(opts) {
  const dlg = $('#dlgName'), form = $('#fName'), input = $('#nameInput'), err = $('#nameErr'), ok = $('#nameOk');
  $('#nameTitle').textContent = opts.title;
  $('#nameHint').textContent = opts.hint || '';
  ok.textContent = opts.ok;
  input.value = ''; err.textContent = '';
  form.onsubmit = async e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { err.textContent = 'Escribe un nombre.'; input.focus(); return; }
    ok.disabled = true;
    ok.textContent = 'Creando…';
    err.textContent = '';
    try {
      await opts.action(name);
      dlg.close();
    } catch (ex) {
      err.textContent = ex.message;
      if (ex.code === 'AUTH') { dlg.close(); openLogin(); }
    } finally {
      ok.disabled = false;
      ok.textContent = opts.ok;
    }
  };
  dlg.showModal();
  input.focus();
}

function newCategory() {
  nameDialog({
    title: 'Nueva categoría',
    hint: 'Por ejemplo: Retrato, Calle, Paisaje. Para elegir el orden, empieza con 01_, 02_… (ese número no se muestra).',
    ok: 'Crear categoría',
    action: async name => {
      await post({ action: 'createFolder', parent: 'root', name });
      invalidate(['tree']);
      toast('Categoría creada.');
      route();
    },
  });
}

function newFolder() {
  const v = state.view;
  if (!v.folderId) return;
  nameDialog({
    title: 'Nueva carpeta en ' + v.label,
    hint: 'Por ejemplo, el nombre de la modelo o de la sesión.',
    ok: 'Crear carpeta',
    action: async name => {
      await post({ action: 'createFolder', parent: v.folderId, name });
      invalidate(['tree']);
      toast('Carpeta creada.');
      route();
    },
  });
}

function confirmDialog(text, okLabel) {
  return new Promise(resolve => {
    const dlg = $('#dlgConfirm');
    $('#confirmText').textContent = text;
    $('#confirmOk').textContent = okLabel;
    let settled = false;
    const done = v => { if (settled) return; settled = true; if (dlg.open) dlg.close(); resolve(v); };
    $('#confirmOk').onclick = () => done(true);
    $('#confirmNo').onclick = () => done(false);
    dlg.oncancel = () => done(false);
    dlg.showModal();
  });
}

async function deletePhoto(id, folderId) {
  const yes = await confirmDialog('La foto se moverá a la papelera de Drive y dejará de verse en la página.', 'Eliminar');
  if (!yes) return;
  try {
    await post({ action: 'trash', id });
    invalidate(['tree', 'photos:' + folderId]);
    toast('Foto eliminada.');
    route();
  } catch (e) {
    toast(e.message, 'error');
    if (e.code === 'AUTH') openLogin();
  }
}

/* ───────── Administrador: foto de perfil ───────── */
function pickProfile() {
  if (!state.admin) { openLogin(); return; }
  $('#profileInput').click();
}

async function uploadProfile(file) {
  if (!file) return;
  if (!ALLOWED.includes(file.type)) { toast('Elige una foto JPG, PNG o WebP.', 'error'); return; }
  toast('Subiendo foto de perfil…');
  try {
    const blob = await prepareImage(file, 1200);
    const data = await blobToBase64(blob);
    await post({ action: 'setProfile', mime: 'image/jpeg', data }, 120000);
    invalidate(['tree']);
    toast('Foto de perfil actualizada.');
    route();
  } catch (e) {
    toast(e.message, 'error');
    if (e.code === 'AUTH') openLogin();
  }
}

/* ───────── Administrador: subida de fotos ───────── */
const up = { items: [], running: false, folderId: null, seq: 0 };

function openUpload() {
  const v = state.view;
  if (!v.folderId) return;
  up.items = []; up.folderId = v.folderId; up.running = false;
  $('#upDest').textContent = 'Destino: ' + v.label;
  $('#upSum').textContent = '';
  $('#fileInput').value = '';
  renderUpList();
  syncUpUi();
  $('#dlgUpload').showModal();
}

function addFiles(fileList) {
  const files = Array.from(fileList || []);
  const good = files.filter(f => ALLOWED.includes(f.type));
  const skipped = files.length - good.length;
  good.forEach(f => {
    const li = el('li', {}, el('span', { class: 'fn', text: f.name }), el('span', { class: 'st', text: 'En cola' }));
    up.items.push({ id: ++up.seq, file: f, status: 'wait', li });
  });
  if (skipped) toast(`Se omitieron ${skipped} archivo(s) que no son JPG, PNG o WebP.`, 'error');
  renderUpList();
  syncUpUi();
}

function renderUpList() {
  $('#upList').replaceChildren(...up.items.map(it => it.li));
}

function setItem(it, status, text) {
  it.status = status;
  it.li.className = status === 'ok' ? 'ok' : status === 'err' ? 'bad' : '';
  $('.st', it.li).textContent = text;
}

function pending() { return up.items.filter(i => i.status !== 'ok'); }

function syncUpUi() {
  const n = pending().length;
  const anyFailed = up.items.some(i => i.status === 'err');
  const go = $('#upGo');
  go.disabled = up.running || n === 0;
  go.textContent = up.running ? 'Subiendo…' : (anyFailed ? `Reintentar (${n})` : (n ? `Subir ${n} foto${n === 1 ? '' : 's'}` : 'Subir'));
  $('#upClose').disabled = up.running;
  $('#fileInput').disabled = up.running;
}

function outName(name) {
  return (String(name).replace(/\.[^.]+$/, '') || 'foto') + '.jpg';
}

async function prepareImage(file, maxSide) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('No se pudo leer la imagen.'));
      i.src = url;
    });
    const scale = Math.min(1, (maxSide || CONFIG.MAX_SIDE) / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', CONFIG.JPEG_QUALITY));
    if (!blob) throw new Error('No se pudo procesar la imagen.');
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('No se pudo leer el archivo.'));
    r.readAsDataURL(blob);
  });
}

async function runUpload() {
  if (up.running) return;
  const queue = pending();
  if (!queue.length) return;
  up.running = true;
  syncUpUi();
  const folderId = up.folderId;
  let okCount = 0, failCount = 0, authFail = false;
  const total = queue.length;
  const sum = $('#upSum');
  sum.textContent = `Subiendo 0 de ${total}…`;

  async function worker() {
    while (queue.length && !authFail) {
      const it = queue.shift();
      try {
        setItem(it, 'work', 'Preparando…');
        const blob = await prepareImage(it.file);
        setItem(it, 'work', 'Subiendo…');
        const data = await blobToBase64(blob);
        await post({ action: 'upload', folder: folderId, name: outName(it.file.name), mime: 'image/jpeg', data }, 120000);
        setItem(it, 'ok', 'Listo');
        okCount++;
      } catch (e) {
        failCount++;
        if (e.code === 'AUTH') { authFail = true; setItem(it, 'err', 'Sesión vencida'); }
        else setItem(it, 'err', e.message);
      }
      sum.textContent = `Subiendo ${okCount + failCount} de ${total}…`;
    }
  }
  await Promise.all([worker(), worker()]);

  up.running = false;
  syncUpUi();
  if (okCount) {
    invalidate(['tree', 'photos:' + folderId]);
    route();
  }
  if (authFail) {
    sum.textContent = 'Tu sesión venció. Entra de nuevo y pulsa Reintentar.';
    openLogin();
  } else if (failCount) {
    sum.textContent = `${okCount} subida${okCount === 1 ? '' : 's'}, ${failCount} con error. Puedes reintentar.`;
  } else {
    toast(okCount === 1 ? 'Foto subida.' : `${okCount} fotos subidas.`);
    $('#dlgUpload').close();
  }
}

/* ───────── Arranque ───────── */
function init() {
  $('#brand').textContent = CONFIG.SITE_NAME;
  renderFooter();
  renderNav();
  initProtection();
  initDock();
  const dim = Number(CONFIG.BACKGROUND_DIM);
  if (isFinite(dim)) document.documentElement.style.setProperty('--bg-dim', String(Math.min(1, Math.max(0, dim))));
  const lh = Number(CONFIG.LOGO_HEIGHT);
  if (isFinite(lh) && lh > 0) document.documentElement.style.setProperty('--logo-cfg', Math.min(120, Math.max(24, lh)) + 'px');
  applyAssets();
  $('#brand').addEventListener('click', e => {
    const h = location.hash;
    if (h === '' || h === '#' || h === '#/') { // ya estás en el inicio: sube suavemente
      e.preventDefault();
      closeMenu();
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    }
  });
  restoreAdmin();

  $('#menuBtn').addEventListener('click', () => {
    const open = $('#nav').classList.toggle('is-open');
    $('.top').classList.toggle('menu-open', open);
    $('#menuBtn').setAttribute('aria-expanded', String(open));
    $('#menuBtn').textContent = open ? 'Cerrar' : 'Menú';
  });
  $('#adminLink').addEventListener('click', () => { if (state.admin) toast('Ya estás en modo administrador.'); else openLogin(); });
  $('#adminOut').addEventListener('click', () => { logout(); toast('Sesión cerrada.'); });
  $('#loginCancel').addEventListener('click', () => $('#dlgLogin').close());
  $('#nameCancel').addEventListener('click', () => $('#dlgName').close());
  $('#upClose').addEventListener('click', () => $('#dlgUpload').close());
  $('#upGo').addEventListener('click', runUpload);
  $('#dlgUpload').addEventListener('cancel', e => { if (up.running) e.preventDefault(); });
  $('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#profileInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; uploadProfile(f); });

  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { if (!up.running) addFiles(e.dataTransfer.files); });
  drop.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !up.running) { e.preventDefault(); $('#fileInput').click(); } });

  let resizeTimer;
  const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { fitNav(); syncBarHeight(); layoutBg(); }, 120); };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNav);
  if ('ResizeObserver' in window) new ResizeObserver(syncBarHeight).observe($('#adminBar'));
  fitNav();
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });
  route();
}

init();
